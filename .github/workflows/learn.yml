name: 過去データ取得と学習
# 公式の過去データを取り込み、予想エンジンの重みを学習し直す

on:
  push:
    branches: [main]
    paths:
      - "scraper/history.py"
      - "scraper/train.py"
      - ".github/workflows/learn.yml"
  schedule:
    # 2時間ごと（足りない過去データを少しずつ埋め、新しい結果が増えたら学習し直す）
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
          pip install requests numpy scipy beautifulsoup4

      - name: 過去データ
        run: python scraper/history.py --data data --minutes 45

      - name: 決まり手（過去分を少しずつ）
        run: python scraper/history.py --data data --kimarite --minutes 25 || true

      - name: オリジナル展示（過去分を少しずつ）
        run: python scraper/oriten.py --data data --minutes 35 || true

      - name: 過去データを先に保存
        working-directory: data
        run: |
          git config user.name "teiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "過去データ $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1

      - name: 学習
        run: |
          NEW=$(cat /tmp/history_new 2>/dev/null || echo 0)
          ORI=$(cat /tmp/oriten_new 2>/dev/null || echo 0)
          if [ "$NEW" != "0" ] || [ "$ORI" -gt 2000 ] || [ ! -f data/model.json ] || [ "${{ github.event_name }}" != "schedule" ]; then
            python scraper/train.py --data data
          else
            echo "新しいデータなし。学習は省略"
          fi

      - name: データを保存
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "学習 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
