name: 過去データ取得と学習
# 公式の過去データを取り込み、予想エンジンの重みを学習し直す

on:
  push:
    branches: [main]
    paths:
      - "scraper/history.py"
      - "scraper/train.py"
      - ".github/workflows/learn.yml"
  schedule:
    # 毎週月曜 3:17（日本時間）
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lhasa
          pip install requests numpy scipy

      - name: 過去データ
        run: |
          if [ -f scraper/train.py ]; then
            python scraper/history.py --data data
          else
            python scraper/history.py --data data --sample
          fi

      - name: 学習
        if: hashFiles('scraper/train.py') != ''
        run: python scraper/train.py --data data

      - name: データを保存
        working-directory: data
        run: |
          git config user.name "teiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "過去データ・学習 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
