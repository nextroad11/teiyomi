name: 出走表と結果（公式の配布ファイル）
# boatrace.jp は使わない。mbrace の番組表(B)・競走成績(K)から日別ファイルを作る・補う。
# 21:15 は翌日の出走表と今日の結果、7:15 は取りこぼし用。
on:
  schedule:
    - cron: "15 12 * * *"   # 日本時間 21:15
    - cron: "15 22 * * *"   # 日本時間 7:15
  workflow_dispatch:
    inputs:
      dates:
        description: "日付（YYYYMMDD をスペース区切り。空なら今日と明日）"
        required: false
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lhasa >/dev/null && pip install -q -r scraper/requirements.txt
      - name: 作る・補う
        run: |
          DS="${{ inputs.dates }}"
          if [ -z "$DS" ]; then DS="$(TZ=Asia/Tokyo date -d yesterday +%Y%m%d) $(TZ=Asia/Tokyo date +%Y%m%d) $(TZ=Asia/Tokyo date -d tomorrow +%Y%m%d)"; fi
          for D in $DS; do python scraper/mbrace_day.py data "$D" || true; sleep 2; done
      - name: 保存
        working-directory: data
        run: |
          git config user.name "teiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "出走表・結果（配布ファイル）"
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase || git rebase --abort; sleep 3; done
          exit 1
