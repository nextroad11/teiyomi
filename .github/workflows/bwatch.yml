name: B級ウォッチ
# 毎朝、前日までの展示から各開催の足の相対評価をつくり、合言葉で暗号化して保存する（enc/bwatch/YYYYMMDD.json）。
# アプリの「B級ウォッチ」タブと、勝負候補の通知（scraper/alert.js）が読む。

on:
  schedule:
    - cron: "23 22 * * *"   # 日本時間 7:23（その日の出走表が入ったあと）
    - cron: "41 23 * * *"   # 日本時間 8:41（取りこぼしたとき用。作成済みなら何もしない）
  workflow_dispatch:
    inputs:
      date:
        description: "日付（YYYYMMDD、空なら今日）"
        required: false
      force:
        description: "作成済みでも作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bwatch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: 評価をつくって保存
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
        run: |
          D="${{ inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Tokyo date +%Y%m%d)
          if [ ! -f "data/$D.json" ] && [ ! -f "data/history/$D.json" ]; then echo "$D の出走表がまだありません"; exit 0; fi
          if [ -f "data/enc/bwatch/$D.json" ] && [ "${{ inputs.force }}" != "true" ]; then echo "作成済み"; exit 0; fi
          mkdir -p /tmp/plain
          python scraper/bwatch.py data "$D" /tmp/plain/bwatch.json
          python scraper/crypt.py encrypt /tmp/plain/bwatch.json "data/enc/bwatch/$D.json"
          cd data
          git config user.name "teiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "enc/bwatch/$D.json"
          git diff --cached --quiet && exit 0
          git commit -q -m "B級ウォッチ $D"
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase || git rebase --abort; sleep 3; done
          exit 1
