name: 下見（オリジナル展示）
on:
  push:
    branches: [main]
    paths: ["scraper/probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/probe.py data/debug/probe
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: data/debug/probe/, retention-days: 3 }
      - run: rm -rf data/debug/probe/p3 data/debug/probe/p3.json
      - working-directory: data
        run: |
          git config user.name "teiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "各場サイトの下見"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
