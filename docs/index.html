<style>
/* Layout: 出走表を中心にした一列の作業画面。上に日付・場・レース選択、下に本線/穴、出走表、記録 */

  --b1:#ffffff; --b1f:#111; --b2:#1b1b1b; --b2f:#fff; --b3:#d62839; --b3f:#fff;
  --b4:#1f56d6; --b4f:#fff; --b5:#f2c40f; --b5f:#111; --b6:#138a43; --b6f:#fff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0a141b; --surface:#111e27; --sunk:#0d1820; --ink:#e4edf2; --muted:#8fa3ae; --line:#233440;
  --accent:#62a8f2; --accent-soft:#132b42; --ana:#f39257; --ana-soft:#3a2216;
  --good:#4ccb7f; --good-soft:#12301f; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}

.tabs button{border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
@media (max-width:480px){.tabs{margin-left:0;width:100%}.tabs button{padding:7px 9px;font-size:12px}}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.wrap{padding-block:16px 48px;display:grid;gap:18px}

.tablebox{max-width:100%;overflow-x:auto}
#v-yoso>div>*,#v-self>div>*{min-width:0}.foot-cell span{display:block;font-size:11px;color:var(--muted)}
.fg{font-size:16px}.fg-up{color:var(--good)}.fg-dn{color:var(--ana)}.fg-mid{color:var(--muted)}

.slit .bnr2{fill:var(--b2);stroke:var(--line)} .slit .bnt2{fill:var(--b2f);font:600 12px var(--f-num)}
.slit .bnr3{fill:var(--b3);stroke:var(--line)} .slit .bnt3{fill:var(--b3f);font:600 12px var(--f-num)}
.slit .bnr4{fill:var(--b4);stroke:var(--line)} .slit .bnt4{fill:var(--b4f);font:600 12px var(--f-num)}
.slit .bnr5{fill:var(--b5);stroke:var(--line)} .slit .bnt5{fill:var(--b5f);font:600 12px var(--f-num)}
.slit .bnr6{fill:var(--b6);stroke:var(--line)} .slit .bnt6{fill:var(--b6f);font:600 12px var(--f-num)}
.scen{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.scen li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.scen .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.scen .bar span{display:block;height:100%;background:var(--accent)}
.scen li>span{display:grid;gap:3px}.scen b{font-variant-numeric:tabular-nums}
.tk-text{font-size:13px;line-height:1.7;margin:0}

.lock[hidden]{display:none}.lockbox{display:grid;gap:12px;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

.lockmsg{min-height:1.2em;color:var(--ana)!important}
.ashi td.pos{color:var(--good);font-weight:600}.ashi td.neg{color:var(--ana)}
.ori td small{display:inline-block;margin-left:4px;font-size:10px;color:var(--muted)}

.ex-lo b{color:var(--muted)}

.man-lo b{color:var(--muted)}

.pill.man-hi{color:var(--ana)}
.arep .mark{background:var(--ana);color:#fff}
.km-cell{min-width:160px}
td.who{min-width:6.5em}td.who b{white-space:nowrap}td.who span{white-space:nowrap}.km{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}

.one-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}

}

 * @param {Array<{waku:number, lap?:number|null, turn?:number|null, straight?:number|null, ex:number}>} boats
 * @returns {Array<{waku, score, rank, z:number[]}>} 入力と同じ並び
 */
function ashiScore(jcd, boats) {
  const code = Number(jcd);
  const w = ASHI_CONFIG.weights[code] || ASHI_CONFIG.defaultWeights;
  const corr = ASHI_CONFIG.corrVenue[code] || ASHI_CONFIG.corrCommon;
  const z = boats.map(() => [0, 0, 0, 0]);
  ASHI_ITEMS.forEach((k, j) => {
    const xs = boats.map(b => (b[k] == null || isNaN(b[k])) ? null
      : Math.round((Number(b[k]) + corr[b.waku][j]) * 100) / 100);   // 補正後を小数第2位に
    const v = xs.filter(x => x != null);
    if (v.length < 2) return;
    const mu = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = Math.sqrt(v.reduce((a, b) => a + (b - mu) ** 2, 0) / (v.length - 1));
    if (!(sd > 0)) return;
    xs.forEach((x, i) => { if (x != null) z[i][j] = (mu - x) / sd; });
  });
  const out = boats.map((b, i) => ({
    waku: b.waku, z: z[i],
    score: z[i].reduce((a, zz, j) => a + w[j] * zz, 0),
  }));
  [...out].sort((a, b) => b.score - a.score || a.waku - b.waku).forEach((o, r) => { o.rank = r + 1; });
  return out;
}

    const ov = ori ? (ori.boats[w] || ori.boats[String(w)] || []) : [];

function parseBets(str){
  const out={};
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-').replace(/[：@×xX]/g,' ').replace(/[円¥￥]/g,' ').replace(/(\d),(\d{3})/g,'$1$2');
  let pend=[];
  const flush=amt=>{pend.forEach(k=>{out[k]=(out[k]||0)+amt;});pend=[];};
  norm.split(/[\s,、，・/]+/).filter(Boolean).forEach(tok=>{
    if(/^\d+$/.test(tok)&&(tok.includes('0')||tok.length>=4||!/^[1-6]{3}$/.test(tok))){if(pend.length)flush(+tok);return;}
    const g=tok.includes('-')?tok.split('-'):(/^[1-6]{3}$/.test(tok)?[...tok]:null);if(!g||g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)pend.push(a+'-'+b+'-'+c);});
  flush(100);
  return out;
}
function parsePicks(str){return Object.keys(parseBets(str));}

  const set=new Set();
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-');
  norm.split(/[\s,、，・/]+/).forEach(tok=>{const g=tok.split('-');if(g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)set.add(a+'-'+b+'-'+c);});
  return [...set];
}

function anaRank(rows){ // rows: {r,a0}。万舟期待と1号艇が飛ぶ確率、それぞれのその日の順位を足した点数の上位 ANA_SHARE を選ぶ
  const n=rows.length,kM=x=>x.a0.manP,kT=x=>x.a0.one.tobu;
  rows.slice().sort((x,y)=>kM(x)-kM(y)).forEach((x,i)=>x.rm=(i+1)/n);
  rows.slice().sort((x,y)=>kT(x)-kT(y)).forEach((x,i)=>x.rt=(i+1)/n);
  rows.forEach(x=>x.sc=x.rm+x.rt);
  const ord=rows.slice().sort((x,y)=>y.sc-x.sc);ord.forEach((x,i)=>{x.rank=i+1;x.pick=i<Math.max(1,Math.round(n*ANA_SHARE));x.star=i<n*0.05?3:i<n*0.10?2:1;});
  return rows;}

// 決まりは3連単フォーメーションのみ。点数・賭け金は任せる。回収率は意識だけ。1週間ごとに報告」

const AIANA={maxPts:6,minOdds:100,budget:10000,
  log:[{d:'11/24',t:'穴レースを全部買う。狙うのは締切前100倍以上の目だけ。3連単フォーメーションのみ。点数・賭け金はAIが決め、回収率を意識する（殿）'},
       {d:'11/24',t:'最初の形：全部の目が100倍以上のフォーメーションで、AIの的中見込み8%以上を最少点数（18点まで）。1レース1万円を同じ払戻になるように配分。10日分（穴レース204R）で回収率約75%・的中6本。ほかの見込み（3〜15%）・点数の上限も裏で計算して、1週間ごとに見直す'},
       {d:'11/24',t:'組み方を変更：1着1〜2艇・2着・3着1〜5艇（どの艇でも）のフォーメーションのうち、全部の目が締切前100倍以上・6点以内で、AIの的中見込みが一番高い形。9日分（11/12〜17・11/22〜24の締切前オッズ）で比べ、全レースでは前半・後半とも回収率83%（的中24本・16本）と一番ぶれが少なく、穴レース274Rでは88%（的中9本、前の形は約79%・7本）。AIとオッズの見方の差が大きい目を選ぶ形は、前半だけ良くて後半は悪かったので使わない'}]};
const AIANA_CACHE={};let AIANA_FORMS=null;

  aiAnaBest({combos:[]},{});const W=[1,2,3,4,5,6],M={};a.combos.forEach(c=>M[c.k]=c.pAi);let bb=null;
  for(const c of AIANA_FORMS){if(c.ks.length>maxPts)continue;let p=0,ok=true;const keys=[];
    for(const [x,y,z] of c.ks){const k=`${W[x]}-${W[y]}-${W[z]}`,v=o[k];if(!v||v<minOdds){ok=false;break;}p+=M[k]||0;keys.push(k);}
    if(!ok||p<minP)continue;if(!bb||p>bb.p+1e-12||(Math.abs(p-bb.p)<=1e-12&&keys.length<bb.n))bb={keys,p,n:keys.length,label:[c.F1,c.F2,c.F3].map(F=>F.map(i=>W[i]).join('')).join('-')};}
  if(bb)bb.keys.sort((x,y)=>(M[y]||0)-(M[x]||0));return bb;}
function aiAnaBest(a,o){ // 1着1〜2艇・2着1〜5艇・3着1〜5艇（どの艇でも）の形のうち、全部の目が minOdds 以上・maxPts 点以内で、AIの的中見込みが一番高いもの
  if(!AIANA_FORMS){const subs=(mn,mx)=>{const out=[];for(let m=1;m<64;m++){const x=[0,1,2,3,4,5].filter(i=>m>>i&1);if(x.length>=mn&&x.length<=mx)out.push(x);}return out;};
    const seen=new Set();AIANA_FORMS=[];
    for(const F1 of subs(1,2))for(const F2 of subs(1,5))for(const F3 of subs(1,5)){const ks=[];for(const x of F1)for(const y of F2)for(const z of F3)if(x!==y&&y!==z&&x!==z)ks.push([x,y,z]);
      if(!ks.length||ks.length>18)continue;const key=ks.map(k=>k.join('')).sort().join(',');if(seen.has(key))continue;seen.add(key);AIANA_FORMS.push({F1,F2,F3,ks});}}
  const W=[1,2,3,4,5,6],M={};a.combos.forEach(c=>M[c.k]=c.pAi);let best=null;
  for(const c of AIANA_FORMS){if(c.ks.length>AIANA.maxPts)continue;let p=0,ok=true;const keys=[];
    for(const [x,y,z] of c.ks){const k=`${W[x]}-${W[y]}-${W[z]}`,v=o[k];if(!v||v<AIANA.minOdds){ok=false;break;}p+=M[k]||0;keys.push(k);}
    if(!ok)continue;if(!best||p>best.p+1e-12||(Math.abs(p-best.p)<=1e-12&&keys.length<best.n))best={keys,p,n:keys.length,label:[c.F1,c.F2,c.F3].map(F=>F.map(i=>W[i]).join('')).join('-')};}
  if(best)best.keys.sort((x,y)=>(M[y]||0)-(M[x]||0));

function aiAnaForm(r,a){

function kmDist(jcd,c){const K=STATS&&STATS.km;const all=K&&K.all&&K.all[c],v=K&&K.v&&K.v[jcd]&&K.v[jcd][c];

function slitOf(r,a){

    const base=hist&&hist.length>=5?avg(hist):num(b.st)??0.17, sd=hist&&hist.length>=5?Math.sqrt(avg(hist.map(x=>(x-base)**2))):null;

    // 11/18 追加（過去1年35万艇、前半で決めて後半で確認：レース内の順位相関 0.297→0.304、のぞきの的中 44.3→45.3%）
    //  ・今節の本番ST：上の予想に15走分の重みで混ぜる（今節の走数が多いほど今節寄り）

function tenkaiOf(r,a){

    if(x.lead>=0.03&&d['まくり'])d['まくり']*=1.6; if(x.dent&&d['まくり'])d['まくり']*=0.6;

// ① スリット隊形：予測ST と 本番ST（結果のスタート順＝コース順）。② 1マークの先頭とその形：一番ありそうな決着（艇×決まり手）と 1着・決まり手
// 11/14〜25の1,203R（展示と本番の進入が同じ）：並びの順位相関 0.36（82%のレースで正）、凹みの予測→実際に凹んだ 42%（予測なし17%）、
// のぞきの予測→実際に内より0.03秒早い 45%（予測なし21%）。1マーク：一番ありそうな形が当たり 50.6%（AIの見込み50.1%、いつも1コース逃げなら51.2%）、
// 逃げ以外を一番に置いたレース214Rでは当たり21.5%、上位3つで69.7%
function stVal(s){s=String(s||'').trim();if(!s||/^[FLK]/.test(s)||!/^\.?\d/.test(s))return null;return parseFloat(s[0]==='.'?'0'+s:s);}
function tenkaiCheck(r,a){
  const res=r.result;if(!res||!res.order||!res.st||res.st.length!==6||!a||a.boats.length!==6)return null;
  let T;try{T=tenkaiOf(r,a);}catch(e){return null;}
  const act={};res.st.forEach((x,i)=>{act[i+1]={waku:+x[0],st:stVal(x[1]),raw:String(x[1])};});
  const same=T.sl.every(x=>act[x.course]&&act[x.course].waku===x.waku);
  const rows=T.sl.map(x=>{const A=act[x.course],nb=[act[x.course-1],act[x.course+1]].filter(v=>v&&v.st!=null).map(v=>v.st);
    const dent=A&&A.st!=null&&nb.length&&A.st-Math.min(...nb)>=0.03&&nb.every(v=>A.st-v>=0.015);
    const lead=x.course>1&&A&&A.st!=null&&act[x.course-1]&&act[x.course-1].st!=null&&act[x.course-1].st-A.st>=0.03;

// ---------------------------------------------------------------- 荒れ狙いフォーメーション（50倍以上の決着を12点以内で押さえる）
// 11/5〜7の411R（公式オッズあり）で確認: 万舟期待「高い」レースで的中19.6%・回収123%（51R・10本的中なので参考）。
// それより自信の低いレースでは回収54%、全レースで買うと56%なので、万舟期待「高い」レースだけ出す
const ARE_CAL=0.69; // AIの「50倍以上になる確率」は高く出る（予測38%→実際27%）ので補正
const subsets=max=>{const r=[];for(let m=1;m<64;m++){const s=[1,2,3,4,5,6].filter((_,i)=>m>>i&1);if(s.length<=max)r.push(s);}return r;};
const SUB2=subsets(2),SUB4=subsets(4);
// 点数は4〜12点で自由。「1点増やすなら、50倍以上が当たる確率を1%以上増やすこと」で決める
// （50倍以上の平均配当は約100倍なので、1点あたり1%が損益の分かれ目）。3日分の試しで平均7.4点・回収156%（12点固定は123%）
const ARE_LAMBDA=0.010;
function areForm(a){
  const P={};a.combos.forEach(c=>P[c.k]=c);let best=null;
  for(const F of SUB2)for(const S of SUB4)for(const T of SUB4){let pts=0,c50=0;const ks=[];
    for(const x of F)for(const y of S)for(const z of T){if(x===y||y===z||x===z)continue;pts++;if(pts>12)break;const k=x+'-'+y+'-'+z;ks.push(k);if(P[k].odds>=50)c50+=P[k].pAi;}
    if(pts>12||pts<4)continue;const sc=c50-ARE_LAMBDA*pts;if(!best||sc>best.sc+1e-9)best={F,S,T,pts,c50,ks,sc};}
  return best;}
function areHtml(r,a,res){
  const p50raw=sum(a.combos.filter(c=>c.odds>=50).map(c=>c.pAi)),p50=clamp(ARE_CAL*p50raw,0,0.8);
  // 「やや高い」帯（素の50倍以上確率45%以上だが万舟期待は高くない）は3日で回収54%だったので出さない
  const conf=a.manP>=0.20?'高':null;
  if(!conf)return '';
  const B=areForm(a);if(!B)return '';
  const P={};a.combos.forEach(c=>P[c.k]=c);const unit=LS.get('unit',1000)>0?LS.get('unit',1000):100;
  const leg=l=>l.map(n=>bn(n)).join('');
  const rows=B.ks.map(k=>P[k]).sort((x,y)=>y.pAi-x.pAi);
  return `<div class="panel arep"><h3><span class="mark">荒れ狙い</span>50倍以上を12点以内で狙うフォーメーション（参考）</h3>
    <div class="expect man-hi"><span class="lbl">荒れる自信</span><b>高い</b><span class="num">50倍以上で決まる確率 ${pct(p50)}（全レースの平均は約27%）</span></div>
    <div class="forms plan"><div class="form"><span class="lbl">フォーメーション${B.pts}点</span>${leg(B.F)}<span class="arrow">→</span>${leg(B.S)}<span class="arrow">→</span>${leg(B.T)}</div></div>
    <ul class="combo-list">${rows.map(c=>`<li class="combo${res&&res.order===c.k?' hit':''}"><span class="nums">${comboHtml(c.k)}</span><span class="bar"><span style="width:${Math.min(100,c.pAi/rows[0].pAi*100)}%"></span></span><span class="val">${pct(c.pAi)}</span></li>`).join('')}</ul>
    <p class="foot">1点${yen(unit)}なら合計${yen(unit*B.pts)}。50倍以上の決着の${pct(B.c50/p50raw)}をこの${B.pts}点で押さえます。点数は4〜12点で、押さえる確率が1点あたり1%以上増えるところまで。<b>注意：11/5〜11の1週間（149レース）では的中10本・回収52%で負けています。</b>最初の3日の好成績（回収156%）はたまたまでした。11/19に作り直すまで、買うときは参考程度に。</p></div>`;}

// ---------------------------------------------------------------- 展示で変わったこと（展示前＝出走表だけの予想と比べる）
function changeHtml(r,a){
  if(!(r.before&&r.before.boats&&Object.values(r.before.boats).some(v=>v.exTime!=null)))return '';
  let b0;try{b0=analyze({...r,before:null});}catch(_){return '';} if(!b0)return '';
  const items=[];let big=false;
  // 1着率の動き
  const mv=a.boats.map(b=>{const o=b0.boats.find(x=>x.waku===b.waku);return {w:b.waku,d:b.pWin-(o?o.pWin:0),from:o?o.pWin:0,to:b.pWin};}).filter(x=>Math.abs(x.d)>=0.04).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  mv.forEach(x=>{if(Math.abs(x.d)>=0.12)big=true;items.push(`<li>${bn(x.w)} 1着率 ${pct(x.from)} → <b class="${x.d>0?'up':'dn'}">${pct(x.to)}</b>（${x.d>0?'+':''}${(x.d*100).toFixed(0)}pt）</li>`);});
  // 本命の入れ替わり
  if(b0.top[0].waku!==a.top[0].waku){big=true;items.unshift(`<li><b>本命が交代</b>：${bn(b0.top[0].waku)} → ${bn(a.top[0].waku)}</li>`);}
  // 進入の変化
  const cv=a.boats.filter(b=>b.course!==b.waku);if(cv.length){big=true;items.push(`<li><b>進入が枠なりでない</b>：${cv.map(b=>`${bn(b.waku)}→${b.course}コース`).join(' ')}</li>`);}
  // 本線の入れ替わり
  const h0=new Set(b0.honsen.map(c=>c.k)),h1=new Set(a.honsen.map(c=>c.k));
  const add=[...h1].filter(k=>!h0.has(k)),del=[...h0].filter(k=>!h1.has(k));
  if(add.length||del.length){items.push(`<li>本線 ${add.length?`追加 ${add.map(k=>`<span class="cmb">${comboHtml(k)}</span>`).join('')}`:''}${del.length?` 外れた ${del.map(k=>`<span class="cmb">${comboHtml(k)}</span>`).join('')}`:''}</li>`);}
  // 期待度・万舟期待
  const e0=expectOf(b0.cover),e1=expectOf(a.cover);if(e0.st!==e1.st)items.push(`<li>当たる期待度 ${e0.st} → <b>${e1.st}</b></li>`);
  const m0=manOf(b0.manP),m1=manOf(a.manP);if(m0.t!==m1.t){if(m1.cls==='hi')big=true;items.push(`<li>万舟期待 ${m0.t}（${pct(b0.manP)}）→ <b>${m1.t}（${pct(a.manP)}）</b></li>`);}
  if(!items.length)return `<div class="panel change"><h3>展示で変わったこと</h3><p class="sub">展示前（出走表だけ）の予想から大きな変化はありません。</p></div>`;
  return `<div class="panel change${big?' big':''}"><h3>${big?'⚠️ 展示で大きく変わりました':'展示で変わったこと'}</h3><p class="sub">展示前（出走表だけ）の予想と、展示・進入・オリジナル展示を入れた今の予想の違い。${big?'大きく変わったレースは荒れやすく、11/5〜7では本線の的中29%（ふだんは40%）でした。':''}</p><ul>${items.join('')}</ul></div>`;
}

// 11/25 殿：レースが終わったら本番の進入で。結果の st はコース順（[艇番, ST]）に並んでいる
function raceCourses(r){const st=r.result&&r.result.st;if(!st||st.length<6)return null;const m={};st.forEach((x,i)=>{m[+x[0]]=i+1;});return Object.keys(m).length===6?m:null;}
function courseHtml(r,a0){

  const rd=r.date||String(r.id||'').slice(0,8), dd=(x,y)=>Math.abs((new Date(x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6))-new Date(y.slice(0,4)+'-'+y.slice(4,6)+'-'+y.slice(6)))/864e5);
  const pc=v=>(v*100).toFixed(1)+'%';
  const rate=(x,n,base)=>{if(!n)return '<td class="n cd-na">-</td>';const v=x/n,cl=n<5?'cd-few':v>=base*1.3&&v>=base+0.03?'cd-hi':v<=base*0.6?'cd-lo':'';return `<td class="n ${cl}">${pc(v)}</td>`;};
  // 11/25 殿：写真（出走表サイト）のように縦に（1〜6コースを横に並べ、項目を縦に）
  const cols=a.boats.slice().sort((x,y)=>x.course-y.course).map(b=>{

    const byB={};g.forEach(k=>{const b=parts(k)[1];(byB[b]=byB[b]||[]).push(parts(k)[2]);});
    Object.keys(byB).map(Number).sort().forEach(b=>out.push({type:byB[b].length===1?'1点':'流し',legs:[[a],[b],byB[b].sort()]}));

// unit が正なら「1点の基本」、負なら「1レースの予算」（例: -3000 = 3,000円を配分）
function betPlan(a,unit,list){
  list=list||a.honsen;if(!list.length)return null;
  const pMin=Math.min(...list.map(c=>c.pAi));
  const rows=list.map(c=>({...c,mul:Math.max(1,Math.min(MAXMUL,Math.round(c.pAi/pMin)))}));
  if(unit>0)rows.forEach(x=>x.stake=x.mul*unit);
  else{const B=-unit,M=sum(rows.map(x=>x.mul));rows.forEach(x=>x.stake=Math.max(100,Math.floor(B*x.mul/M/100)*100));
    let left=B-sum(rows.map(x=>x.stake));for(const x of rows.slice().sort((p,q)=>q.pAi-p.pAi)){if(left<100)break;x.stake+=100;left-=100;}}
  const total=sum(rows.map(x=>x.stake));
  rows.forEach(x=>{x.back=Math.round(x.stake*x.odds);x.gami=x.back<total;});
  const evBack=sum(rows.map(x=>x.pAi*x.back));
  return {rows,total,hitP:a.cover,evBack,forms:toForms(list.map(c=>c.k)),real:!!a.real};
}

// SAIONJI 用：表示中の日付の全レースを analyze() した結果を1つのJSONにしてコピー（予想ロジックは使うだけで変えない）
const APP_VERSION='117';  // 公開のたびに上げる（URLの ?v= と同じ番号）
// 結果（取れているレースだけ）。返還艇＝本番のSTが F・L の艇と、STの記録が無い艇（欠場）
function saionjiResult(r){
  const res=r.result||{}, voidR=!!(r.cancel||/中止|不成立/.test(res.note||''));
  if(!res.order&&!voidR)return null;
  const st=res.st||[], refund=[];
  st.forEach(([w,v])=>{if(/[FL]/.test(String(v)))refund.push(+w);});
  if(st.length&&st.length<6)for(let w=1;w<=6;w++)if(!st.some(([x])=>+x===w))refund.push(w);
  return {order:res.order||null,payout:voidR?null:(res.payout??null),status:voidR?'void':'normal',
    refundBoats:[...new Set(refund)].sort((a,b)=>a-b),fetchedAt:res.at||null};
}
function saionjiDay(){
  const r4=v=>v==null||!isFinite(v)?null:Math.round(v*10000)/10000;
  const out={format:'saionji-day-v1',date:dateSel,generatedAt:new Date().toISOString(),
    engine:{commit:null,modelTrainedAt:(MODEL&&MODEL.trainedAt)||null,appVersion:APP_VERSION},races:[]};
  races.slice().sort((x,y)=>(x.deadline||'').localeCompare(y.deadline||'')||x.jcd-y.jcd||x.rno-y.rno).forEach(r=>{
    let a=null;try{a=A(r);}catch(_){a=null;}
    if(!a)return;
    out.races.push({id:r.id,jcd:r.jcd,venue:r.venue||VENUES[r.jcd]||null,rno:r.rno,name:r.name||null,grade:r.grade||null,deadline:r.deadline||null,
      beforeComplete:!!(r.before&&r.before.complete),
      level:a.level??null,manP:r4(a.manP),tobu:r4(a.one&&a.one.tobu),
      result:saionjiResult(r),
      honsen:(a.honsen||[]).map(c=>({k:c.k,p:r4(c.pAi)})),
      ana:(a.ana||[]).map(c=>({k:c.k,p:r4(c.pAi)})),
      boats:a.boats.map(b=>({waku:b.waku,name:b.name??null,cls:b.cls??null,natWin:b.natWin??null,locWin:b.locWin??null,motor2:b.motor2??null,
        st:b.st??null,f:b.f??null,exTime:b.exTime??null,course:b.course??null,pWin:r4(b.pWin),footGrade:b.footGrade??null}))});
  });
  return out;
}

// ---------------------------------------------------------------- B級ウォッチ
// 毎朝、前日までの足スコアを開催全体でまとめて評価した結果（scraper/bwatch.py）を読み、
// 今日の各レースでAIの確率に「今節の足」を足して、B級選手を1着・2着に置いた3連単の期待値を出す。
let BW=null, bwShow=LS.get('bwShow','SA');
const BW_BETA=0.08;   // 今節の足の評価1あたり、勝ちやすさに足す量（11/14のバックテスト：当日の展示を入れたうえで改善度+19）
const BW_EV=1.2, BW_MINP=0.004, BW_MAX=6;   // 推奨の条件（期待値1.2以上・確率0.4%以上・最大6点）。オッズの記録で検証中
function bwRace(r,vmap,w){
  const a=A(r);if(!a)return null;
  const bs=a.boats.map(b=>{const e=vmap[b.toban],k=Math.exp(BW_BETA*(e?e.rt:0));return {...b,winW:b.winW*k,plW:b.plW*k};});
  const P=trifecta(bs,'winW','plW',MODEL.tenkai),odds=Object.fromEntries(a.combos.map(c=>[c.k,c]));
  const W=sum(bs.map(b=>b.winW)),bb=bs.find(b=>b.waku===w);
  const p1=bb?bb.winW/W:0;let p2=0,p3=0;const cand=[];
  for(const k in P){const f=k.split('-').map(Number);if(f[0]===w||f[1]===w)p2+=P[k];if(f.includes(w))p3+=P[k];
    const c=odds[k];if((f[0]===w||f[1]===w)&&c&&c.real)cand.push({k,p:P[k],odds:c.odds,ev:P[k]*c.odds});}
  const rec=cand.filter(c=>c.ev>=BW_EV&&c.p>=BW_MINP).sort((x,y)=>y.ev-x.ev).slice(0,BW_MAX);
  return {a,p1,p2:Math.min(1,p2),p3:Math.min(1,p3),rec,best:cand.length?Math.max(...cand.map(c=>c.ev)):null,real:!!a.real};
}

    <details><summary class="sub">評価の根拠（過去1年のうち、基準づくりに使っていない後半の期間）</summary>
    <table class="bw-tbl"><tr><th>評価</th><th>1着</th><th>2連対</th><th>3連対</th><th>1着流しの回収率</th></tr>

    <p class="hint">計測1走だけの選手は1段階下げ、B2は最高A、足の評価が効きにくい場（江戸川・住之江・三国・蒲郡）は最高Bです。評価だけで毎回買うと回収率は100%に届かない点に注意してください。取得できないデータ：スリットの行き足・1マークの旋回内容・着順に出ない不利。</p></details>
    ${extra||''}

}
function renderBW(){

  if(!BW){el.innerHTML=`<div class="bw-grid">${bwIntro()}<div class="empty"><b>${fmtDate(dateSel)}のB級ウォッチはまだありません。</b><br>毎朝7時台に、前日までの展示から作ります。</div></div>`;bwSeg(el);return;}
  const cards=[];let sumN=0,sumIn3=0;
  for(const [js,v] of Object.entries(BW.venues).sort((x,y)=>+x[0]-+y[0])){

    const head=`<h3>${esc(v.venue)} <small>${v.day}日目・足の評価の効き目 ${esc(v.reliab)}${v.players.length?'・'+v.players[0].N+'人を評価':''}</small></h3>`;
    if(!v.players.length){cards.push(`<div class="panel bw-venue">${head}<p class="sub">${esc(v.note||'評価なし')}</p></div>`);continue;}

    const pls=list.map(p=>{
      const rs=(p.today||[]).map(([rno,w])=>{const r=races.find(x=>x.jcd===+js&&x.rno===rno);if(!r)return '';
        const x=bwRace(r,vmap,w);if(!x)return '';
        const res=resultOf(r),done=!!(res&&res.order),fin=done?res.order.split('-').map(Number).indexOf(w)+1:0;
        if(done){sumN++;if(fin>=1&&fin<=3)sumIn3++;}
        const aim=done?['no','終了']:!x.real?null:x.rec.length&&'SA'.includes(p.grade)&&x.p2>=0.2?['go','勝負']:x.rec.length?['ok','狙い']:['no','見送り（期待値不足）'];
        const recs=x.rec.map(c=>`<span class="${done&&res.order===c.k?'hit':''}">${c.k} ${c.odds}倍 <small>期待値${c.ev.toFixed(2)}</small></span>`).join('');
        return `<button class="bw-race" data-id="${esc(r.id)}"><div class="row"><b>${rno}R</b><span>${esc(r.deadline||'')}</span>${bn(w)}
          <span>1着 ${pc(x.p1)}・2着以内 ${pc(x.p2)}・3着以内 ${pc(x.p3)}</span>${aim?`<span class="bw-aim ${aim[0]}">${aim[1]}</span>`:''}
          ${done?`<span>結果 ${esc(res.order)}（${fin?fin+'着':'着外'}）</span>`:''}</div>
          ${recs&&!done?`<div class="bw-recs">${recs}</div><small style="color:var(--muted)">推奨は各100円から。この選手を1着か2着に置いた3連単のうち、期待値の高い順</small>`:x.best!=null&&!done?`<small style="color:var(--muted)">一番良い組でも期待値${x.best.toFixed(2)}</small>`:''}</button>`;}).join('');
      return `<div class="bw-pl"><div class="bw-head"><span class="bw-g ${p.grade}">${p.grade}</span><b class="pl-link" data-toban="${p.toban}">${esc(p.name||'')}</b><span class="tag">${esc(p.cls)}</span>
        <span class="tag">勝率${p.nw??'-'}</span><span class="tag">モーター${p.m2??'-'}%</span></div>

    cards.push(`<div class="panel bw-venue">${head}${pls}</div>`);
  }
  const today=sumN?`<p class="sub">今日の結果：表示中の選手は${sumN}走して${sumIn3}回3着以内（${pc(sumIn3/sumN)}）。</p>`:'';

  bwSeg(el);
  el.querySelectorAll('.bw-race').forEach(b=>b.addEventListener('click',()=>{const r=races.find(x=>x.id===b.dataset.id);if(!r)return;

// ---------------------------------------------------------------- 万舟（その日の3連単1万円以上のレースと、なぜ荒れたかの解説）
// 解説は取得したデータだけから作る（出走表・展示・オリジナル展示・進入・結果・最終オッズ・AIの事前の見立て）。
// 決まり手・人気・本番のSTは公式の結果ページから（11/15以降の結果。それより前は「取得前」）。
let manSort=LS.get('manSort','t');
function manshuOf(r){
  const res=resultOf(r);if(!res||!res.order||(res.payout||0)<10000)return null;
  const a=A(r);if(!a)return null;
  const ord=res.order.split('-').map(Number), B=Object.fromEntries(a.boats.map(b=>[b.waku,b]));
  const fin=w=>ord.indexOf(w)+1;  // 0なら4着以下
  const bf=(r.before&&r.before.boats)||{}, corr=ashiCorr(r.jcd);
  const ce={};a.boats.forEach(b=>{if(b.exTime!=null)ce[b.waku]=b.exTime+corr[b.waku][3];});
  const exRank=w=>ce[w]==null?null:1+Object.values(ce).filter(v=>v<ce[w]-1e-9).length;
  const st={};(res.st||[]).forEach(([w,v])=>{st[w]=v;});
  const stNum=w=>{const v=st[w];if(!v)return null;const m=String(v).match(/F|L/);const n=parseFloat(String(v).replace(/[FL]/g,'')||'NaN');return m?{f:m[0],n}:{f:'',n};};
  const stRank=w=>{const x=stNum(w);if(!x||x.f)return null;return 1+Object.keys(st).filter(k=>{const y=stNum(+k);return y&&!y.f&&y.n<x.n-1e-9;}).length;};
  const cmb=a.combos.find(c=>c.k===res.order), aiRank=a.combos.indexOf(cmb)+1;
  const real=realOdds(r), oddsRank=real?1+Object.values(real.map).filter(v=>v<real.map[res.order]).length:null;
  const pop=res.pop||oddsRank;
  const pts=[], tags=[];
  // 1号艇
  const b1=B[1], f1=fin(1);
  if(f1===0||f1>=4){tags.push('イン飛び');
    const why=[];
    if(b1.course!==1)why.push(`${b1.course}コースに回った`);
    if(b1.cls&&/^B/.test(b1.cls))why.push(`${b1.cls}`);
    const er=exRank(1);if(er&&er>=4)why.push(`補正後の展示は${er}位`);
    if(b1.ashi&&b1.ashi.rank>=4)why.push(`足スコア${b1.ashi.rank}位`);
    const sr=stRank(1),sn=stNum(1);if(sn&&sn.f)why.push(`スタート${sn.f}`);else if(sr&&sr>=4)why.push(`本番のSTは${st[1]}で${sr}番目`);
    pts.push(`1号艇 ${esc(b1.name||'')}（${esc(b1.cls||'')}）は${f1?f1+'着':'4着以下'}${why.length?'。'+why.join('・'):''}。AIの事前の「飛ぶ確率」は${Math.round(a.one.tobu*100)}%${a.one.tobu>=0.35?'（アラート対象）':''}。`);
  }else pts.push(f1===1?`1号艇 ${esc(b1.name||'')}は1着。荒れたのは2着・3着の組み合わせ。`:`1号艇 ${esc(b1.name||'')}（${esc(b1.cls||'')}）は${f1}着に残った。`);
  // 勝った艇
  const w1=ord[0], bw1=B[w1];
  if(w1!==1){
    const c=bw1.course, why=[];
    const er=exRank(w1);if(er&&er<=2)why.push(`補正後の展示${er}位`);
    if(bw1.ashi&&bw1.ashi.rank<=2)why.push(`足スコア${bw1.ashi.rank}位`);
    const inner=a.boats.filter(x=>x.course<c&&ce[x.waku]!=null);
    if(c>1&&ce[w1]!=null&&inner.length){const nb=inner.find(x=>x.course===c-1);
      if(inner.every(x=>ce[w1]<ce[x.waku]))why.push('内側の全艇より展示が速い');
      else if(nb&&ce[nb.waku]-ce[w1]>=0.06)why.push('すぐ内側より展示が0.06秒以上速い');}
    const sr=stRank(w1);if(sr===1)why.push(`STが全体で一番速い（${st[w1]}）`);else if(sr===2)why.push(`STが2番目に速い（${st[w1]}）`);
    if(c>=4)tags.push('外からの1着');
    pts.push(`1着は${w1}号艇 ${esc(bw1.name||'')}（${esc(bw1.cls||'')}・勝率${num(bw1.natWin)>0?bw1.natWin:'-'}）が${c}コースから${res.km?'「'+esc(res.km)+'」':''}${why.length?'。'+why.join('・'):''}。`);
  }
  // 2・3着の伏兵
  for(const w of ord.slice(1)){const b=B[w];const weak=(b.cls==='B2')||(num(b.natWin)>0&&num(b.natWin)<4.0);
    if(weak){tags.push('伏兵が着');pts.push(`${fin(w)}着に${w}号艇 ${esc(b.name||'')}（${esc(b.cls||'')}・勝率${num(b.natWin)>0?b.natWin:'-'}）が残った${b.ashi&&b.ashi.rank<=2?'（足スコアは'+b.ashi.rank+'位で、足は良かった）':''}。`);}}
  // A級が飛んだ
  const aOut=a.boats.filter(b=>/^A/.test(b.cls||'')&&!ord.includes(b.waku));
  if(aOut.length>=2){tags.push('A級総崩れ');pts.push(`A級の${aOut.map(b=>b.waku+'号艇').join('・')}が3着に入れなかった。`);}
  // 進入・水面
  const moved=a.boats.filter(b=>b.course!==b.waku);
  if(moved.length){tags.push('進入変化');pts.push(`進入が変わった（${a.boats.slice().sort((x,y)=>x.course-y.course).map(b=>b.waku).join('')}）。`);}
  const ws=num(r.before&&r.before.windSpeed),wv=num(r.before&&r.before.wave);
  if((ws!=null&&ws>=5)||(wv!=null&&wv>=5)){tags.push('風・波');pts.push(`水面は${windTxt(r.before)||'風'+(ws??'-')+'m'}・波${wv??'-'}cm。`);}
  // AIの見立て
  pts.push(`AIの評価：この組は120通り中${aiRank}番目（確率${(cmb.pAi*100).toFixed(1)}%）。レース前の万舟期待は${Math.round(a.manP*100)}%${a.manP>=0.2?'（荒れ狙いの対象）':''}。${a.honsen.some(c=>c.k===res.order)?'本線に入っていた。':a.ana.some(c=>c.k===res.order)?'穴に入っていた。':''}`);
  if(!res.km)pts.push('決まり手・本番のST：この日の分は公式の結果ページからまだ取得していません。');
  const kind=tags.includes('イン飛び')?(tags.includes('外からの1着')?'イン飛び＋外の1着':'イン飛び'):f1===1?'2・3着の波乱':'インが負けた';
  return {r,a,res,ord,pop,aiRank,pAi:cmb.pAi,pts,tags,kind,flagged:a.manP>=0.2};
}
function renderMan(){
  const el=$('#v-man');if(!races.length){el.innerHTML=emptyState();return;}
  const done=races.filter(r=>{const x=resultOf(r);return x&&x.order&&x.payout>0;});
  const list=races.map(r=>{try{return manshuOf(r);}catch(_){return null;}}).filter(Boolean);
  list.sort(manSort==='p'?(x,y)=>y.res.payout-x.res.payout:(x,y)=>(x.r.deadline||'').localeCompare(y.r.deadline||'')||x.r.jcd-y.r.jcd);
  const pc=v=>Math.round(v*100)+'%';
  const flagAll=done.filter(r=>{const a=A(r);return a&&a.manP>=0.2;});
  const flagHit=flagAll.filter(r=>resultOf(r).payout>=10000).length;
  const cnt=k=>list.filter(x=>x.tags.includes(k)).length;
  const kmC={};list.forEach(x=>{if(x.res.km)kmC[x.res.km]=(kmC[x.res.km]||0)+1;});
  const avgPay=list.length?Math.round(sum(list.map(x=>x.res.payout))/list.length):0;
  el.innerHTML=`<div style="display:grid;gap:12px">
    <div class="panel"><h3>万舟（3連単1万円以上）</h3>
      <p class="sub">${fmtDate(dateSel)}：結果が出た${done.length}レース中 <b>${list.length}レース</b>（${done.length?pc(list.length/done.length):'-'}）。平均${yen(avgPay)}。</p>
      ${list.length?`<p class="sub">荒れ方：1号艇が飛んだ ${cnt('イン飛び')}・4〜6コースが1着 ${cnt('外からの1着')}・B2や勝率4未満が着 ${cnt('伏兵が着')}・A級総崩れ ${cnt('A級総崩れ')}・進入変化 ${cnt('進入変化')}・風波 ${cnt('風・波')}${Object.keys(kmC).length?'。決まり手：'+Object.entries(kmC).map(([k,v])=>k+v).join('・'):''}。</p>
      <p class="sub">AIの事前の見立て：万舟期待20%以上と見たのは${flagAll.length}レースで、そのうち万舟は${flagHit}レース（${flagAll.length?pc(flagHit/flagAll.length):'-'}）。万舟${list.length}レースのうち、事前に20%以上と見ていたのは${list.filter(x=>x.flagged).length}レース。</p>`:''}
      <p class="hint">解説は取得したデータから自動で作ります（展示・オリジナル展示・足スコア・進入・本番のST・決まり手・AIの事前の見立て）。1マークの旋回内容や不利は取得できないので書いていません。</p>
      <div class="seg" role="group" aria-label="並べ方"><button data-s="t" aria-pressed="${manSort==='t'}">締切順</button><button data-s="p" aria-pressed="${manSort==='p'}">配当の高い順</button></div></div>
    ${list.length?list.map(x=>`<button class="man-card" data-id="${esc(x.r.id)}">
      <div class="man-head"><b>${esc(x.r.venue||VENUES[x.r.jcd])} ${x.r.rno}R</b><span>${esc(x.r.deadline||'')}</span>
        <span class="man-ord">${x.ord.map(w=>bn(w)).join('<i>-</i>')}</span><b class="man-pay">${yen(x.res.payout)}</b>
        ${x.pop?`<span class="tag">${x.pop}番人気${x.res.pop?'':'（最終オッズから）'}</span>`:''}<span class="tag">${esc(x.kind)}</span></div>
      <ul class="man-pts">${x.pts.map(t=>`<li>${t}</li>`).join('')}</ul></button>`).join(''):`<div class="empty">${done.length?'この日はまだ万舟が出ていません。':'まだ結果の入ったレースがありません。'}</div>`}
  </div>`;
  el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{manSort=b.dataset.s;LS.set('manSort',manSort);renderMan();}));
  el.querySelectorAll('.man-card').forEach(b=>b.addEventListener('click',()=>{const r=races.find(x=>x.id===b.dataset.id);if(!r)return;
    jcdSel=r.jcd;LS.set('jcd',jcdSel);raceId=r.id;view='yoso';LS.set('view',view);const s2=$('#venue');if(s2)s2.value=String(jcdSel);renderChips();renderView();window.scrollTo(0,0);}));
}

/* ============ 成績（今見ている日付のレース） ============ */
function learnPanel(){
  if(!REPORT)return `<div class="panel"><h3>AIの学習状況</h3><p class="sub">過去データでの学習はまだです。学習が終わるとここに成績が出ます。</p></div>`;
  const t=REPORT.test, h=t.honsen, a=t.ana, d=s=>s?`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`:'';
  return `<div class="panel"><h3>AIの学習状況</h3>
    <p class="sub">${d(REPORT.period.from)}〜${d(REPORT.period.to)}の${REPORT.races.all.toLocaleString()}レースで学習。下の成績は、学習に使っていない${d(REPORT.period.testFrom)}以降の${REPORT.races.test.toLocaleString()}レースで試した結果です（1点100円・実際の払戻）。フォーメーションの的中率は11/21に同じ方法で確かめた値です。</p>
    <div class="stats">
      <div class="stat"><span>1着の的中率</span><b>${pct(t.winTopHit)}</b></div>
      <div class="stat"><span>本線の的中率</span><b>${pct(h.hitRate)}</b></div>
      <div class="stat"><span>本線の回収率</span><b>${Math.round(h.roi*100)}%</b></div>
      <div class="stat"><span>本線フォーメーションの的中率</span><b>32.3%</b></div>
      <div class="stat"><span>穴フォーメーションの的中率</span><b>12.2%</b></div>
    </div>
    <p class="hint">学習日 ${esc((REPORT.trainedAt||'').slice(0,10))}。毎週月曜に最新のデータで学習し直します。</p></div>`;
}
function renderRec(){
  const el=$('#v-rec');
  const done=races.filter(r=>{const x=resultOf(r);return x&&x.order&&A(r);});
  if(!done.length){el.innerHTML=learnPanel()+`<div class="empty" style="margin-top:16px"><b>${fmtDate(dateSel)}はまだ結果の入ったレースがありません。</b><br>結果はレース後に自動で入ります。AI本線・AI穴・ChatGPT・一撃くん・自分の回収率をここで比べます。</div>`;return;}
  // AIは「買い方」と同じ配分（予算・基本額の設定どおり）、他の予想は入力した金額で数える
  const unit=LS.get('unit',1000);
  const aiBets=(r,keys)=>{const a=A(r),m=Object.fromEntries(a.combos.map(c=>[c.k,c]));const P=betPlan(a,unit,keys.map(k=>m[k]).filter(Boolean));return P?Object.fromEntries(P.rows.map(x=>[x.k,x.stake])):{};};
  const aiH=r=>aiBets(r,history[r.id]?.h||A(r).honsen.map(c=>c.k)), aiA=r=>{const ks=history[r.id]?.a||A(r).ana.map(c=>c.k);return Object.fromEntries(ks.map(k=>[k,unit>0?unit:100]));};
  const srcs=[['AI本線',aiH],['AI穴',aiA],['ChatGPT',r=>parseBets(pk(r.id).chatgpt)],['一撃くん',r=>parseBets(pk(r.id).ikkun)],['自分',r=>parseBets(pk(r.id).mine)]];
  const aggOf=list=>srcs.map(([name,f])=>{let n=0,pts=0,inv=0,ret=0,hits=0;list.forEach(r=>{const bs=f(r),x=resultOf(r),ks=Object.keys(bs);if(!ks.length)return;n++;pts+=ks.length;inv+=sum(Object.values(bs));if(bs[x.order]){hits++;ret+=(x.payout||0)*bs[x.order]/100;}});return {name,n,pts,inv,ret,hits};});
  const agg=aggOf(done);
  // ChatGPT・一撃くん・自分のどれかを入れたレースだけで、同じ条件で比べる
  const same=done.filter(r=>{const q=pk(r.id);return q.chatgpt||q.ikkun||q.mine;});
  const aggS=same.length?aggOf(same):null;
  const tbl=(g)=>`<div class="tablebox"><table class="rec">
      <thead><tr><th>予想</th><th>レース数</th><th>平均点数</th><th>的中</th><th>的中率</th><th>投資</th><th>払戻</th><th>回収率</th></tr></thead>
      <tbody>${g.map(g=>`<tr><td class="src">${g.name}</td><td>${g.n}</td><td>${g.n?(g.pts/g.n).toFixed(1)+'点':'-'}</td><td>${g.hits}</td><td>${g.n?pct(g.hits/g.n):'-'}</td><td>${yen(g.inv)}</td><td>${yen(Math.round(g.ret))}</td><td class="${g.inv&&g.ret>=g.inv?'hit':''}">${g.inv?Math.round(g.ret/g.inv*100)+'%':'-'}</td></tr>`).join('')}</tbody></table></div>`;
  el.innerHTML=`<div style="display:grid;gap:16px">${learnPanel()}
    ${aggS?`<div><p class="card-title">同じレースで比較（他の予想を入れた${same.length}レース）</p>${tbl(aggS)}</div>`:''}
    <div><p class="card-title">${fmtDate(dateSel)}の全レース（入力した金額で計算・${done.length}レース）</p>${tbl(agg)}</div>
    <div><p class="card-title">レースごと</p><div class="tablebox"><table class="rec">
      <thead><tr><th>レース</th><th>結果</th><th>払戻</th><th>AI本線</th><th>AI穴</th><th>ChatGPT</th><th>一撃くん</th><th>自分</th></tr></thead>
      <tbody>${done.sort((a,b)=>a.jcd-b.jcd||a.rno-b.rno).map(r=>{const x=resultOf(r);return `<tr><td class="src">${esc(r.venue||VENUES[r.jcd])}${r.rno}R</td><td>${esc(x.order)}</td><td>${yen(x.payout)}</td>${srcs.map(([,f])=>{const bs=f(r),ks=Object.keys(bs);return `<td>${!ks.length?'-':bs[x.order]?`<span class="hit">的中</span><br><small>${yen(Math.round(x.payout*bs[x.order]/100))}</small>`:'×'}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>
    <p class="hint">AIの本線・穴は、締切時点でこの端末に記録した買い目で数えます（記録前のレースは今のデータで計算）。</p>
  </div>`;
}

/* ============ 起動 ============ */
$('#date').addEventListener('change',e=>{dateSel=e.target.value;raceId=null;loadDay();});
$('#saionji').addEventListener('click',copySaionji);
$('#venue').addEventListener('change',e=>{jcdSel=+e.target.value;LS.set('jcd',jcdSel);raceId=null;renderChips();renderView();});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;raceId=b.dataset.id;renderChips();renderView();});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;LS.set('view',view);renderView();}));
// ---------------------------------------------------------------- 合言葉（データの暗号を解く）
// 合言葉 → PBKDF2-SHA256(310000回) → AES-256-GCM。scraper/crypt.py と同じ計算。端末には合言葉ではなく鍵だけを保存
let DKEY=null;
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('teiyomi-v1'),iterations:310000},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openBox(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(box.iv)},key||DKEY,ub64(box.ct));return JSON.parse(new TextDecoder().decode(pt));}
let PLAIN=false; // 切り替え前（鍵のかかったデータがまだ無い）は今まで通り読む
async function fetchEnc(path,key){if(PLAIN&&!key)return fetchJSON(path);return openBox(await fetchJSON('enc/'+path),key);}
// 速く開くための工夫：model.json は1回だけ読む。学習結果（stats、約2.4MB）は学習の時刻が変わったときだけ読み直し、
// それ以外はこの端末に保存した分（IndexedDB）を使う。保存できない環境ではいつも通り読む。
let MODEL_BOX=null;
const idb={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{try{const q=indexedDB.open('teiyomi',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}}));},
  async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});}catch(_){return null;}},
  async set(k,v){try{const d=await this.open();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(_){}}};
async function loadStats(at){
  if(PLAIN)return fetchJSON('stats.json');
  const c=at?await idb.get('stats'):null;
  if(c&&c.at===at&&c.box){try{return await openBox(c.box);}catch(_){}}
  const box=await fetchJSON('enc/stats.json');const st=await openBox(box);
  if(at&&st&&st.updated===at)idb.set('stats',{at,box});
  return st;
}
async function unlock(){
  try{const r=await fetch(DATA_BASE+'enc/model.json?t='+Date.now(),{cache:'no-store'});if(r.status===404){PLAIN=true;return;}if(r.ok)MODEL_BOX=await r.json();}catch(_){}
  try{const raw=LS.get('k',null);if(raw){const k=await crypto.subtle.importKey('raw',ub64(raw),{name:'AES-GCM'},true,['decrypt']);await (MODEL_BOX?openBox(MODEL_BOX,k):fetchEnc('model.json',k));DKEY=k;return;}}catch(_){}
  const L=$('#lock');L.hidden=false;$('#lockpw').focus();
  await new Promise(res=>{$('#lockf').onsubmit=async e=>{e.preventDefault();const msg=$('#lockmsg');msg.textContent='確認中…';
    try{const k=await deriveKey($('#lockpw').value.trim().normalize('NFKC'));await fetchEnc('model.json',k);DKEY=k;
      LS.set('k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))));L.hidden=true;res();}
    catch(_){msg.textContent='合言葉が違うか、通信できませんでした。';}};});
}
(async()=>{
  await unlock();
  let m=null;
  try{m=MODEL_BOX&&!PLAIN?await openBox(MODEL_BOX):await fetchEnc('model.json');}catch(_){}
  if(m)MODEL={...MODEL,...m,weights:{...MODEL.weights,...(m.weights||{})},market:{...MODEL.market,...(m.market||{}),cls:{...MODEL.market.cls,...((m.market||{}).cls||{})}},ana:{...MODEL.ana,...(m.ana||{})}};
  // 成績・学習結果・日付一覧は同時に読む
  await Promise.all([
    fetchEnc('report.json').then(x=>{REPORT=x;}).catch(()=>{}),
    loadStats(m&&m.trainedAt).then(x=>{STATS=x;}).catch(()=>{}),
    loadIndex().catch(()=>{}),
  ]);
  await loadDay();
  setInterval(async()=>{if(document.hidden||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;const keep=raceId;await loadDay();raceId=keep;renderChips();},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDay();});
})();
</script>
