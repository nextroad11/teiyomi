<header class="top"><div class="wrap">

<script>
/* ============ 設定 ============ */
const DATA_BASE='https://raw.githubusercontent.com/nextroad11/teiyomi/data/';
const VENUES={1:'桐生',2:'戸田',3:'江戸川',4:'平和島',5:'多摩川',6:'浜名湖',7:'蒲郡',8:'常滑',9:'津',10:'三国',11:'びわこ',12:'住之江',13:'尼崎',14:'鳴門',15:'丸亀',16:'児島',17:'宮島',18:'徳山',19:'下関',20:'若松',21:'芦屋',22:'福岡',23:'唐津',24:'大村'};
// 予想エンジンの重み（model.json があればそちらで上書き）
let MODEL={weights:{skill:0.9,local:0.3,motor:0.45,boat:0.12,st:0.35,ex:0.5,fPen:0.3,kWin:0.75,kPlace:0.6},
  baseDefault:[0.55,0.14,0.12,0.11,0.06,0.02],
  baseVenue:{2:[0.45,0.17,0.15,0.13,0.07,0.03],3:[0.46,0.17,0.14,0.13,0.07,0.03],4:[0.47,0.17,0.14,0.12,0.07,0.03],12:[0.57,0.14,0.11,0.10,0.06,0.02],18:[0.62,0.13,0.10,0.08,0.05,0.02],24:[0.64,0.12,0.10,0.08,0.04,0.02]},
  place:[0.20,0.21,0.19,0.18,0.13,0.09],
  // 人気の見立て（学習前の初期値。学習後は実際の払戻から推定した値になる）
  market:{inner:0.15,kNat:0.99,kMotor:0,kEx:0,cls:{A1:0.225,A2:0.09,B1:-0.18,B2:-0.45},kPlace:0.77,c0:0},
  ana:{minRatio:1.25,minOdds:20,minP:0.007,max:5}};
let REPORT=null, STATS=null;
const BASE1=[.55,.14,.12,.11,.06,.02], CW_K=8;
const lgt=p=>Math.log(p/(1-p));
function cwinOf(toban,c){const e=STATS&&STATS.p[String(toban)];const wn=e?e.cw[c-1]:[0,0];const p=(wn[0]+BASE1[c-1]*CW_K)/(wn[1]+CW_K);return lgt(p)-lgt(BASE1[c-1]);}
const ORI_GROUP={'一周':0,'半周ラップ':0,'半周':0,'まわり足':1,'直線':2};
// オリジナル展示を同じレース内で比べる（速いほど＋）→ {waku: [一周, まわり足, 直線]}。学習側(train.py)と同じ計算
function oriFeats(o){const f={};for(let w=1;w<=6;w++)f[w]=[0,0,0];if(!o||!o.items)return f;
  o.items.forEach((name,j)=>{const g=ORI_GROUP[name];if(g==null)return;const v=[1,2,3,4,5,6].map(w=>num((o.boats[w]||[])[j]));const ok=v.filter(x=>x!=null);if(ok.length<5)return;
    const m=avg(ok),sd=Math.max(Math.sqrt(avg(ok.map(x=>(x-m)**2))),0.03);v.forEach((x,i)=>{if(x!=null)f[i+1][g]=-clamp((x-m)/sd,-2.5,2.5);});});return f;}
function oriRank(o){const r={};if(!o||!o.items)return r;o.items.forEach((name,j)=>{const v=[1,2,3,4,5,6].map(w=>({w,x:num((o.boats[w]||[])[j])})).filter(e=>e.x!=null).sort((a,b)=>a.x-b.x);v.forEach((e,i)=>{(r[e.w]=r[e.w]||{})[name]=i+1;});});return r;}

const ASHI_CORR={1:[0.40,0.20,0,0.02],2:[0.30,0.10,0,0.01],3:[0.20,0,0,0],4:[0.10,-0.05,-0.01,-0.01],5:[0.05,-0.10,-0.02,-0.02],6:[0,-0.15,-0.02,-0.02]};

// 金額つきの買い目: 「1-3-2 300」「132 135 341 300円」「1-23-234:200」など。金額は直前の買い目まとめてに付く。無ければ100円
function parseBets(str){
  const out={};
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-').replace(/[：@×xX]/g,' ').replace(/[円¥￥]/g,' ').replace(/(\d),(\d{3})/g,'$1$2');

  norm.split(/[\s,、，・/]+/).filter(Boolean).forEach(tok=>{
    if(/^\d+$/.test(tok)&&(tok.includes('0')||tok.length>=4||!/^[1-6]{3}$/.test(tok))){if(pend.length)flush(+tok);return;}
    const g=tok.includes('-')?tok.split('-'):(/^[1-6]{3}$/.test(tok)?[...tok]:null);if(!g||g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)pend.push(a+'-'+b+'-'+c);});
  flush(100);
  return out;
}
function parsePicks(str){return Object.keys(parseBets(str));}
function parsePicksOld(str){
  const set=new Set();

  norm.split(/[\s,、，・/]+/).forEach(tok=>{const g=tok.split('-');if(g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));

  return [...set];
}

const MAXMUL=5;
function toForms(keys){

  const byA={};ks.forEach(k=>{const [a]=parts(k);(byA[a]=byA[a]||[]).push(k);});
  for(const a of Object.keys(byA).map(Number).sort()){
    const g=byA[a],S2=[...new Set(g.map(k=>parts(k)[1]))].sort(),T=[...new Set(g.map(k=>parts(k)[2]))].sort();

    const byB={};g.forEach(k=>{const b=parts(k)[1];(byB[b]=byB[b]||[]).push(parts(k)[2]);});

  $('#unit')?.addEventListener('change',e=>{LS.set('unit',+e.target.value);renderYoso();});
}

function copyForClaude(r,a){
  const data={レース:`${fmtDate(r.date)} ${r.venue||VENUES[r.jcd]} ${r.rno}R ${r.name||''} ${r.distance||''}m 締切${r.deadline||''}`,
    風波:r.before?{風速:r.before.windSpeed,波高:r.before.wave}:null,
    艇:a.boats.map(b=>({枠:b.waku,選手:b.name,級:b.cls,全国勝率:b.natWin,当地勝率:b.locWin,モーター2連:b.motor2,ST:b.st,F:b.f,展示:b.exTime,チルト:b.tilt,進入:b.course,AI1着率:+(b.pWin*100).toFixed(1)})),
    AI本線:a.honsen.map(c=>`${c.k} ${(c.pAi*100).toFixed(1)}%`),AI穴:a.ana.map(c=>`${c.k} ${(c.pAi*100).toFixed(1)}% ${c.real?'オッズ':'推定'}${odds(c.odds)}倍`)};
  const text=`艇読みAIのこのレースを解説して。展開予想、本線と穴の根拠、注意点を短く。\n${JSON.stringify(data)}`;
  const done=()=>toast('コピーしました。Claudeのチャットに貼り付けてください');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));}else fallbackCopy(text,done);
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){toast('コピーできませんでした');}ta.remove();}

/* ============ 買い目計算 ============ */
function calcCombos(){const out=[];
  if(calc.mode==='box'){const s=[...calc.sel[0]];for(const a of s)for(const b of s)for(const c of s)if(a!==b&&b!==c&&a!==c)out.push(a+'-'+b+'-'+c);}
  else{for(const a of calc.sel[0])for(const b of calc.sel[1])for(const c of calc.sel[2])if(a!==b&&b!==c&&a!==c)out.push(a+'-'+b+'-'+c);}
  return out.sort();}
function statsHtml(list,r,a,map){const hitP=a?sum(list.map(k=>map[k]?.pAi||0)):0,back=a?sum(list.map(k=>(map[k]?.pAi||0)*(map[k]?.odds||0)))*calc.stake:0;
  return `<div class="stat"><span>点数</span><b>${list.length}点</b></div><div class="stat"><span>合計金額</span><b>${yen(list.length*calc.stake)}</b></div>${a?`<div class="stat"><span>AI的中確率（${r.rno}R）</span><b>${pct(hitP)}</b></div><div class="stat"><span>推定回収の期待値</span><b>${list.length?Math.round(back/(list.length*calc.stake)*100)+'%':'-'}</b></div>`:''}`;}
const gridHtml=(list,map)=>list.map(k=>`<div class="cg"><span class="nums">${comboHtml(k)}</span>${map[k]?`<span>${pct(map[k].pAi)}・${odds(map[k].odds)}倍</span>`:''}</div>`).join('');
function renderCalc(){
  const el=$('#v-calc'), r=cur(), a=r?A(r):null, map=a?Object.fromEntries(a.combos.map(c=>[c.k,c])):{};
  const rows=calc.mode==='box'?[['ボックス',0]]:[['1着',0],['2着',1],['3着',2]], list=calcCombos();
  el.innerHTML=`<div style="display:grid;gap:16px">
    <div class="panel picker">
      <div class="prow"><span class="seg"><button data-mode="form" aria-pressed="${calc.mode==='form'}">フォーメーション</button><button data-mode="box" aria-pressed="${calc.mode==='box'}">ボックス</button></span>
      <label class="status" for="stake">1点</label><input id="stake" inputmode="numeric" value="${calc.stake}" style="width:80px;font:14px var(--f-num);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><span class="status">円</span></div>
      ${rows.map(([lab,i])=>`<div class="prow"><span class="lab">${lab}</span>${[1,2,3,4,5,6].map(n=>`<button class="tog" data-row="${i}" data-n="${n}" aria-pressed="${calc.sel[i].has(n)}" aria-label="${lab} ${n}号艇">${n}</button>`).join('')}</div>`).join('')}
      <div class="prow"><button class="btn ghost" id="fill-h" type="button"${a?'':' disabled'}>AI本線を読み込む</button><button class="btn ghost" id="fill-a" type="button"${a?'':' disabled'}>AI穴を読み込む</button></div>
      <div class="field"><label for="paste">買い目を貼り付けて計算（例：1-23-234, 2-1-3）</label><textarea id="paste" placeholder="一撃くんやChatGPTの買い目を貼ると、点数・金額を計算します"></textarea></div>
    </div>
    <div class="stats" id="cstats">${statsHtml(list,r,a,map)}</div>
    <div class="combo-grid" id="cgrid">${gridHtml(list,map)}</div>
    ${a?`<p class="hint">確率と倍率は${esc(r.venue||'')}${r.rno}Rの推定値です。倍率は人気の推定で、実際のオッズとは違います。</p>`:''}
  </div>`;
  const showList=ks=>{$('#cstats').innerHTML=statsHtml(ks,r,a,map);$('#cgrid').innerHTML=gridHtml(ks,map);el.querySelectorAll('.tog').forEach(b=>b.setAttribute('aria-pressed','false'));};
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{calc.mode=b.dataset.mode;renderCalc();});
  el.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const s=calc.sel[+b.dataset.row],n=+b.dataset.n;s.has(n)?s.delete(n):s.add(n);renderCalc();});
  $('#stake').onchange=e=>{calc.stake=Math.max(100,Math.round((num(e.target.value)||100)/100)*100);renderCalc();};
  if(a){$('#fill-h').onclick=()=>showList(a.honsen.map(c=>c.k));$('#fill-a').onclick=()=>showList(a.ana.map(c=>c.k));}
  $('#paste').oninput=e=>{const ks=parsePicks(e.target.value);if(ks.length)showList(ks);};
}

/* ============ 成績（今見ている日付のレース） ============ */
function learnPanel(){
  if(!REPORT)return `<div class="panel"><h3>AIの学習状況</h3><p class="sub">過去データでの学習はまだです。学習が終わるとここに成績が出ます。</p></div>`;
  const t=REPORT.test, h=t.honsen, a=t.ana, d=s=>s?`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`:'';
  return `<div class="panel"><h3>AIの学習状況</h3>
    <p class="sub">${d(REPORT.period.from)}〜${d(REPORT.period.to)}の${REPORT.races.all.toLocaleString()}レースで学習。下の成績は、学習に使っていない${d(REPORT.period.testFrom)}以降の${REPORT.races.test.toLocaleString()}レースで試した結果です（1点100円・実際の払戻）。</p>
    <div class="stats">
      <div class="stat"><span>1着の的中率</span><b>${pct(t.winTopHit)}</b></div>
      <div class="stat"><span>本線の的中率</span><b>${pct(h.hitRate)}</b></div>
      <div class="stat"><span>本線の回収率</span><b>${Math.round(h.roi*100)}%</b></div>
      <div class="stat"><span>穴の的中率</span><b>${pct(a.hitRate)}</b></div>
      <div class="stat"><span>穴の回収率</span><b>${Math.round(a.roi*100)}%</b></div>
    </div>
    <p class="hint">学習日 ${esc((REPORT.trainedAt||'').slice(0,10))}。毎週月曜に最新のデータで学習し直します。</p></div>`;
}
function renderRec(){
  const el=$('#v-rec');
  const done=races.filter(r=>{const x=resultOf(r);return x&&x.order&&A(r);});
  if(!done.length){el.innerHTML=learnPanel()+`<div class="empty" style="margin-top:16px"><b>${fmtDate(dateSel)}はまだ結果の入ったレースがありません。</b><br>結果はレース後に自動で入ります。AI本線・AI穴・ChatGPT・一撃くん・自分の回収率をここで比べます。</div>`;return;}
  // AIは「買い方」と同じ配分（予算・基本額の設定どおり）、他の予想は入力した金額で数える
  const unit=LS.get('unit',1000);
  const aiBets=(r,keys)=>{const a=A(r),m=Object.fromEntries(a.combos.map(c=>[c.k,c]));const P=betPlan(a,unit,keys.map(k=>m[k]).filter(Boolean));return P?Object.fromEntries(P.rows.map(x=>[x.k,x.stake])):{};};
  const aiH=r=>aiBets(r,history[r.id]?.h||A(r).honsen.map(c=>c.k)), aiA=r=>{const ks=history[r.id]?.a||A(r).ana.map(c=>c.k);return Object.fromEntries(ks.map(k=>[k,unit>0?unit:100]));};
  const srcs=[['AI本線',aiH],['AI穴',aiA],['ChatGPT',r=>parseBets(pk(r.id).chatgpt)],['一撃くん',r=>parseBets(pk(r.id).ikkun)],['自分',r=>parseBets(pk(r.id).mine)]];
  const aggOf=list=>srcs.map(([name,f])=>{let n=0,pts=0,inv=0,ret=0,hits=0;list.forEach(r=>{const bs=f(r),x=resultOf(r),ks=Object.keys(bs);if(!ks.length)return;n++;pts+=ks.length;inv+=sum(Object.values(bs));if(bs[x.order]){hits++;ret+=(x.payout||0)*bs[x.order]/100;}});return {name,n,pts,inv,ret,hits};});
  const agg=aggOf(done);
  // ChatGPT・一撃くん・自分のどれかを入れたレースだけで、同じ条件で比べる
  const same=done.filter(r=>{const q=pk(r.id);return q.chatgpt||q.ikkun||q.mine;});
  const aggS=same.length?aggOf(same):null;
  const tbl=(g)=>`<div class="tablebox"><table class="rec">
      <thead><tr><th>予想</th><th>レース数</th><th>平均点数</th><th>的中</th><th>的中率</th><th>投資</th><th>払戻</th><th>回収率</th></tr></thead>
      <tbody>${g.map(g=>`<tr><td class="src">${g.name}</td><td>${g.n}</td><td>${g.n?(g.pts/g.n).toFixed(1)+'点':'-'}</td><td>${g.hits}</td><td>${g.n?pct(g.hits/g.n):'-'}</td><td>${yen(g.inv)}</td><td>${yen(Math.round(g.ret))}</td><td class="${g.inv&&g.ret>=g.inv?'hit':''}">${g.inv?Math.round(g.ret/g.inv*100)+'%':'-'}</td></tr>`).join('')}</tbody></table></div>`;
  el.innerHTML=`<div style="display:grid;gap:16px">${learnPanel()}
    ${aggS?`<div><p class="card-title">同じレースで比較（他の予想を入れた${same.length}レース）</p>${tbl(aggS)}</div>`:''}
    <div><p class="card-title">${fmtDate(dateSel)}の全レース（入力した金額で計算・${done.length}レース）</p>${tbl(agg)}</div>
    <div><p class="card-title">レースごと</p><div class="tablebox"><table class="rec">
      <thead><tr><th>レース</th><th>結果</th><th>払戻</th><th>AI本線</th><th>AI穴</th><th>ChatGPT</th><th>一撃くん</th><th>自分</th></tr></thead>
      <tbody>${done.sort((a,b)=>a.jcd-b.jcd||a.rno-b.rno).map(r=>{const x=resultOf(r);return `<tr><td class="src">${esc(r.venue||VENUES[r.jcd])}${r.rno}R</td><td>${esc(x.order)}</td><td>${yen(x.payout)}</td>${srcs.map(([,f])=>{const bs=f(r),ks=Object.keys(bs);return `<td>${!ks.length?'-':bs[x.order]?`<span class="hit">的中</span><br><small>${yen(Math.round(x.payout*bs[x.order]/100))}</small>`:'×'}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>
    <p class="hint">AIの本線・穴は、締切時点でこの端末に記録した買い目で数えます（記録前のレースは今のデータで計算）。</p>
  </div>`;
}

/* ============ 起動 ============ */
$('#date').addEventListener('change',e=>{dateSel=e.target.value;raceId=null;loadDay();});
$('#venue').addEventListener('change',e=>{jcdSel=+e.target.value;LS.set('jcd',jcdSel);raceId=null;renderChips();renderView();});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;raceId=b.dataset.id;renderChips();renderView();});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;LS.set('view',view);renderView();}));
// ---------------------------------------------------------------- 合言葉（データの暗号を解く）
// 合言葉 → PBKDF2-SHA256(310000回) → AES-256-GCM。scraper/crypt.py と同じ計算。端末には合言葉ではなく鍵だけを保存
let DKEY=null;
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('teiyomi-v1'),iterations:310000},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openBox(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(box.iv)},key||DKEY,ub64(box.ct));return JSON.parse(new TextDecoder().decode(pt));}
let PLAIN=false; // 切り替え前（鍵のかかったデータがまだ無い）は今まで通り読む
async function fetchEnc(path,key){if(PLAIN&&!key)return fetchJSON(path);return openBox(await fetchJSON('enc/'+path),key);}
async function unlock(){
  try{const r=await fetch(DATA_BASE+'enc/model.json?t='+Date.now(),{cache:'no-store'});if(r.status===404){PLAIN=true;return;}}catch(_){}
  try{const raw=LS.get('k',null);if(raw){const k=await crypto.subtle.importKey('raw',ub64(raw),{name:'AES-GCM'},true,['decrypt']);await fetchEnc('model.json',k);DKEY=k;return;}}catch(_){}
  const L=$('#lock');L.hidden=false;$('#lockpw').focus();
  await new Promise(res=>{$('#lockf').onsubmit=async e=>{e.preventDefault();const msg=$('#lockmsg');msg.textContent='確認中…';
    try{const k=await deriveKey($('#lockpw').value.trim().normalize('NFKC'));await fetchEnc('model.json',k);DKEY=k;
      LS.set('k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))));L.hidden=true;res();}
    catch(_){msg.textContent='合言葉が違うか、通信できませんでした。';}};});
}
(async()=>{
  await unlock();
  let m=null;
  try{m=await fetchEnc('model.json');}catch(_){}
  if(m)MODEL={...MODEL,...m,weights:{...MODEL.weights,...(m.weights||{})},market:{...MODEL.market,...(m.market||{}),cls:{...MODEL.market.cls,...((m.market||{}).cls||{})}},ana:{...MODEL.ana,...(m.ana||{})}};
  try{REPORT=await fetchEnc('report.json');}catch(_){}
  try{STATS=await fetchEnc('stats.json');}catch(_){}
  await loadIndex();await loadDay();
  setInterval(async()=>{if(document.hidden||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;const keep=raceId;await loadDay();raceId=keep;renderChips();},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDay();});
})();
</script>
