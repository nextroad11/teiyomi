<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>艇読みAI</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 出走表を中心にした一列の作業画面。上に日付・場・レース選択、下に本線/穴、出走表、記録 */
:root{
  --bg:#eef3f5; --surface:#ffffff; --sunk:#e3ebef; --ink:#0d1f2b; --muted:#566b77; --line:#d2dde3;
  --accent:#0b5cad; --accent-soft:#dbe9f7; --ana:#c2410c; --ana-soft:#fbe6da;
  --good:#15803d; --good-soft:#dcf1e3;
  --b1:#ffffff; --b1f:#111; --b2:#1b1b1b; --b2f:#fff; --b3:#d62839; --b3f:#fff;
  --b4:#1f56d6; --b4f:#fff; --b5:#f2c40f; --b5f:#111; --b6:#138a43; --b6f:#fff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0a141b; --surface:#111e27; --sunk:#0d1820; --ink:#e4edf2; --muted:#8fa3ae; --line:#233440;
  --accent:#62a8f2; --accent-soft:#132b42; --ana:#f39257; --ana-soft:#3a2216;
  --good:#4ccb7f; --good-soft:#12301f; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;margin:0;display:flex;align-items:baseline;gap:8px;font-weight:400}
.brand small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:7px 12px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.wrap{padding-block:16px 48px;display:grid;gap:18px}
.meetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meetbar select{font:700 15px var(--f-body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.meetbar .note{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font-family:var(--f-body);min-width:74px}
.chip b{font-family:var(--f-num);font-size:15px;display:block;line-height:1.2}
.chip span{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.racehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.racehead h2{font-family:var(--f-display);font-size:26px;margin:0;font-weight:400;text-wrap:balance}
.racehead .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.kata{background:var(--good-soft);color:var(--good)}
.pill.futsu{background:var(--accent-soft);color:var(--accent)}
.pill.are{background:var(--ana-soft);color:var(--ana)}
.pill.info{background:var(--sunk);color:var(--ink);font-weight:400}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 .mark{font-family:var(--f-display);font-weight:400;font-size:13px;padding:2px 8px;border-radius:6px;color:var(--surface)}
.honsen h3 .mark{background:var(--accent)} .ana h3 .mark{background:var(--ana)}
.panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.combo-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.combo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.combo .nums,.cg .nums{display:flex;gap:3px;align-items:center}
.combo .nums i,.cg .nums i{font-style:normal;color:var(--muted);font-size:11px}
.combo .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.combo .bar span{display:block;height:100%;background:var(--accent)}
.ana .combo .bar span{background:var(--ana)}
.combo .val{font-family:var(--f-num);font-size:13px;text-align:right;white-space:nowrap}
.combo .val small{color:var(--muted);font-size:11px;margin-left:6px}
.combo.hit .nums{outline:2px solid var(--good);outline-offset:2px;border-radius:4px}
.plan .forms{display:grid;gap:6px;margin:4px 0 12px}
.plan .form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600}
.plan .form .lbl{font-size:12px;font-weight:600;color:var(--muted);min-width:5.5em}
.plan .form .arrow{color:var(--muted)}
.plan table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.plan td,.plan th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
.plan th{font-size:11px;color:var(--muted);font-weight:600}
.plan td:first-child,.plan th:first-child{text-align:left}
.plan tr.big td{font-weight:700}
.plan .warn{color:var(--ana)}
.plan .unit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.plan .unit select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.panel .foot{margin-top:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:600 13px var(--f-num);border:1px solid var(--line)}
.bn[data-n="1"]{background:var(--b1);color:var(--b1f)} .bn[data-n="2"]{background:var(--b2);color:var(--b2f)}
.bn[data-n="3"]{background:var(--b3);color:var(--b3f);border-color:transparent} .bn[data-n="4"]{background:var(--b4);color:var(--b4f);border-color:transparent}
.bn[data-n="5"]{background:var(--b5);color:var(--b5f);border-color:transparent} .bn[data-n="6"]{background:var(--b6);color:var(--b6f);border-color:transparent}
.bn.lg{width:30px;height:30px;font-size:16px;border-radius:7px}
.comment{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.comment p{margin:0;max-width:68ch}
.btn{font:700 13px var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.card-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.card{border-collapse:collapse;width:100%;min-width:700px;font-variant-numeric:tabular-nums}
.card th,.card td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.card th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--sunk)}
.card tr:last-child td{border-bottom:0}
.card td.n{font-family:var(--f-num);font-size:13px;text-align:right}
.card .who b{display:block;font-size:14px}
.card .who span{font-size:11px;color:var(--muted)}
.card input{width:64px;font:13px var(--f-num);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
.card input.auto{border-color:var(--accent)}
.winbar{display:flex;align-items:center;gap:8px;min-width:120px}
.winbar .track{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.winbar .track span{display:block;height:100%;background:var(--accent)}
.winbar b{font:600 13px var(--f-num);width:44px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.plus{background:var(--good-soft);color:var(--good)}
.tag.minus{background:var(--ana-soft);color:var(--ana)}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.record{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field textarea{font:14px var(--f-num);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.field textarea{min-height:58px;resize:vertical}
.rowact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.status{font-size:12px;color:var(--muted)}
.picker{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .lab{width:38px;font-weight:700;font-size:13px}
.tog{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font:600 16px var(--f-num);opacity:.5}
.tog[aria-pressed="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.tog[data-n="1"]{background:var(--b1);color:var(--b1f)} .tog[data-n="2"]{background:var(--b2);color:var(--b2f)}
.tog[data-n="3"]{background:var(--b3);color:var(--b3f)} .tog[data-n="4"]{background:var(--b4);color:var(--b4f)}
.tog[data-n="5"]{background:var(--b5);color:var(--b5f)} .tog[data-n="6"]{background:var(--b6);color:var(--b6f)}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:8px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:700 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat span{font-size:11px;color:var(--muted);display:block}
.stat b{font:600 20px var(--f-num)}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cg{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:12px var(--f-num)}
table.rec{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.rec th,.rec td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.rec th:first-child,.rec td:first-child{text-align:left}
.rec th{font-size:11px;color:var(--muted);background:var(--sunk)}
.rec td{font-family:var(--f-num);font-size:13px}
.rec td.src{font-family:var(--f-body);font-weight:700}
.hit{color:var(--good);font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);max-width:68ch}
.empty b{color:var(--ink)}
.disclaim{font-size:11px;color:var(--muted);max-width:72ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 class="brand">艇読みAI <small>BOATRACE ANALYZER</small></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-yoso" aria-selected="true" data-view="yoso">予想</button>
    <button role="tab" id="tab-calc" aria-selected="false" data-view="calc">買い目計算</button>
    <button role="tab" id="tab-rec" aria-selected="false" data-view="rec">成績</button>
  </nav>
</div></header>

<main class="wrap">
  <div class="meetbar">
    <select id="date" aria-label="日付を選ぶ"></select>
    <select id="venue" aria-label="レース場を選ぶ"></select>
    <span class="note" id="loadnote">データを読み込み中…</span>
  </div>
  <div class="chips" id="chips" role="group" aria-label="レースを選ぶ"></div>
  <section id="v-yoso"></section>
  <section id="v-calc" hidden></section>
  <section id="v-rec" hidden></section>
  <p class="disclaim">確率は公式の出走表・直前情報から計算した推定値で、的中を保証するものではありません。推定オッズは人気を予想したもので、実際のオッズとは異なります。舟券は20歳から、無理のない金額で。データ出典：BOAT RACE オフィシャルウェブサイト。</p>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ 設定 ============ */
const DATA_BASE='https://raw.githubusercontent.com/nextroad11/teiyomi/data/';
const VENUES={1:'桐生',2:'戸田',3:'江戸川',4:'平和島',5:'多摩川',6:'浜名湖',7:'蒲郡',8:'常滑',9:'津',10:'三国',11:'びわこ',12:'住之江',13:'尼崎',14:'鳴門',15:'丸亀',16:'児島',17:'宮島',18:'徳山',19:'下関',20:'若松',21:'芦屋',22:'福岡',23:'唐津',24:'大村'};
// 予想エンジンの重み（model.json があればそちらで上書き）
let MODEL={weights:{skill:0.9,local:0.3,motor:0.45,boat:0.12,st:0.35,ex:0.5,fPen:0.3,kWin:0.75,kPlace:0.6},
  baseDefault:[0.55,0.14,0.12,0.11,0.06,0.02],
  baseVenue:{2:[0.45,0.17,0.15,0.13,0.07,0.03],3:[0.46,0.17,0.14,0.13,0.07,0.03],4:[0.47,0.17,0.14,0.12,0.07,0.03],12:[0.57,0.14,0.11,0.10,0.06,0.02],18:[0.62,0.13,0.10,0.08,0.05,0.02],24:[0.64,0.12,0.10,0.08,0.04,0.02]},
  place:[0.20,0.21,0.19,0.18,0.13,0.09],
  // 人気の見立て（学習前の初期値。学習後は実際の払戻から推定した値になる）
  market:{inner:0.15,kNat:0.99,kMotor:0,kEx:0,cls:{A1:0.225,A2:0.09,B1:-0.18,B2:-0.45},kPlace:0.77,c0:0},
  ana:{minRatio:1.25,minOdds:20,minP:0.007,max:5}};
let REPORT=null;
const PAYBACK=0.75;

/* ============ 予想エンジン ============ */
const num=v=>(v===null||v===undefined||v===''||isNaN(+v))?null:+v;
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:null;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function trifecta(boats,wk,pk){
  const W=sum(boats.map(b=>b[wk])),P=sum(boats.map(b=>b[pk])),out={};
  for(const a of boats)for(const b of boats){if(b===a)continue;for(const c of boats){if(c===a||c===b)continue;
    out[a.waku+'-'+b.waku+'-'+c.waku]=(a[wk]/W)*(b[pk]/(P-a[pk]))*(c[pk]/(P-a[pk]-b[pk]));}}
  return out;
}

const TRI_KEYS=[];for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)for(let c=1;c<=6;c++)if(a!==b&&b!==c&&a!==c)TRI_KEYS.push(`${a}-${b}-${c}`);
function realOdds(race){const o=race.odds;if(!o||!Array.isArray(o.t)||o.t.length!==120)return null;
  const map={};let inv=0;o.t.forEach((v,i)=>{if(v&&v>=1){map[TRI_KEYS[i]]=v;inv+=1/v;}});
  return inv>0?{map,inv,at:o.fetchedAt,final:!!o.final}:null;}
function analyze(race,exOverride){
  const B=(race.boats||[]).slice().sort((a,b)=>a.waku-b.waku);
  if(B.length!==6) return null;
  const w=MODEL.weights, PLACE=MODEL.place;
  const src=(race.before&&race.before.boats)||{};
  const ex={};for(const k of ['1','2','3','4','5','6'])ex[k]={...(src[k]||{}),...((exOverride&&exOverride[k]!=null)?{exTime:exOverride[k]}:{})};
  const exT=B.map(b=>num(ex[b.waku].exTime));
  const exV=exT.filter(v=>v!=null);
  const exMean=exV.length>=4?avg(exV):null, exBest=exV.length>=4?Math.min(...exV):null;
  const base=MODEL.baseVenue[race.jcd]||MODEL.baseDefault;
  const m2Mean=avg(B.map(b=>num(b.motor2)).filter(v=>v!=null));
  const boats=B.map((b,i)=>{
    const course=clamp(num(ex[b.waku].course)||b.waku,1,6);
    const nat=num(b.natWin)??5.0, loc=num(b.locWin), locEff=(loc&&loc>0)?loc:nat;
    const m2=num(b.motor2)>0?num(b.motor2):33, b2=num(b.boat2)>0?num(b.boat2):33, st=num(b.st)??0.17, f=num(b.f)||0;
    const parts={skill:w.skill*(nat-5.5)/1.2, local:w.local*(locEff-nat)/1.2, motor:w.motor*(m2-35)/8, boat:w.boat*(b2-33)/6,
      st:-w.st*clamp((st-0.16)/0.025,-2.5,2.5), ex:(exMean!=null&&exT[i]!=null)?-w.ex*clamp((exT[i]-exMean)/0.07,-2.5,2.5):0};
    const s=sum(Object.values(parts)), fPen=f>0?-w.fPen:0;
    const mk=MODEL.market, exF=(exMean!=null&&exT[i]!=null)?-clamp((exT[i]-exMean)/0.07,-2.5,2.5):0;
    const sm=mk.kNat*(nat-5.5)/1.2+mk.kMotor*(m2-35)/8+mk.kEx*exF+(mk.cls[b.cls]??0);
    const tags=[];
    if(m2Mean!=null&&m2>=m2Mean+5)tags.push(['plus','モーター上位']);
    if(m2Mean!=null&&m2<=m2Mean-5)tags.push(['minus','モーター劣勢']);
    if(loc&&loc>=nat+0.4)tags.push(['plus','当地巧者']);
    if(loc&&loc>0&&loc<=nat-0.8)tags.push(['minus','当地苦戦']);
    if(st<=0.13)tags.push(['plus','ST速い']); if(st>=0.18)tags.push(['minus','ST遅め']);
    if(f>0)tags.push(['minus','F'+f+'持ち']);
    if(exBest!=null&&exT[i]===exBest)tags.push(['plus','展示1位']);
    if(course!==b.waku)tags.push(['',course+'コース進入']);
    return {...b,course,parts,s,exTime:exT[i],tilt:num(ex[b.waku].tilt),tags,
      winW:Math.exp(Math.log(base[course-1])+w.kWin*(s+fPen)), plW:Math.exp(Math.log(PLACE[course-1])+w.kPlace*s),
      mWinW:Math.exp(Math.log(base[course-1])+(course===1?mk.inner:0)+sm), mPlW:Math.exp(Math.log(PLACE[course-1])+mk.kPlace*sm)};
  });
  const ai=trifecta(boats,'winW','plW'), mkP=trifecta(boats,'mWinW','mPlW');
  const W=sum(boats.map(b=>b.winW));
  boats.forEach(b=>{b.pWin=b.winW/W;});
  const oddsK=PAYBACK*Math.exp(MODEL.market.c0||0);
  // 公式の3連単オッズが取れていればそれを使う（人気 = 1/オッズ を合計1にそろえたもの）
  const real=realOdds(race);
  const combos=Object.keys(ai).map(k=>{const pAi=ai[k];
    if(real&&real.map[k]){const odds=real.map[k],pMk=(1/odds)/real.inv;return {k,pAi,pMk,odds,ev:pAi*odds,ratio:pAi/pMk,real:true};}
    const pMk=mkP[k],odds=Math.max(1,Math.round(oddsK/pMk*10)/10);
    return {k,pAi,pMk,odds,ev:pAi*odds,ratio:pAi/pMk,real:false};}).sort((x,y)=>y.pAi-x.pAi);
  const honsen=[];let cum=0;
  for(const c of combos){if(honsen.length>=6||(honsen.length>=3&&cum>=0.35))break;honsen.push(c);cum+=c.pAi;}
  const hset=new Set(honsen.map(c=>c.k));
  const R=MODEL.ana;
  // 公式オッズのときは、オッズでの実績がそろうまで穴は2点までの参考扱い
  const anaMax=real&&!(MODEL.live&&MODEL.live.ready)?Math.min(R.max,2):R.max;
  const ana=combos.filter(c=>!hset.has(c.k)&&c.pAi>=R.minP&&c.odds>=R.minOdds&&c.ratio>=R.minRatio).sort((x,y)=>y.ev-x.ev).slice(0,anaMax);
  const top=boats.slice().sort((a,b)=>b.pWin-a.pWin), topWin=top[0].pWin;
  return {boats,combos,honsen,ana,cover:cum,top,topWin,real,level:topWin>=0.6?'kata':topWin>=0.42?'futsu':'are',hasEx:exMean!=null};
}

function parsePicks(str){
  const set=new Set();
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-');
  norm.split(/[\s,、，・/]+/).forEach(tok=>{const g=tok.split('-');if(g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)set.add(a+'-'+b+'-'+c);});
  return [...set];
}

// ---------------------------------------------------------------- 買い方（フォーメーション・BOX・金額配分）
const MAXMUL=5;
function toForms(keys){
  const ks=[...new Set(keys)], parts=k=>k.split('-').map(Number), out=[];
  const boats=[...new Set(ks.flatMap(parts))];
  if(boats.length===3&&ks.length===6)return [{type:'BOX',legs:[boats.sort()]}];
  const covers=(f,s2,t)=>{const r=[];f.forEach(a=>s2.forEach(b=>t.forEach(c=>{if(a!==b&&b!==c&&a!==c)r.push(`${a}-${b}-${c}`)})));return r;};
  // 1着ごとにまとめ、2着×3着の形でぴったり表せればフォーメーション、だめなら1・2着ごとにまとめる
  const byA={};ks.forEach(k=>{const [a]=parts(k);(byA[a]=byA[a]||[]).push(k);});
  for(const a of Object.keys(byA).map(Number).sort()){
    const g=byA[a],S2=[...new Set(g.map(k=>parts(k)[1]))].sort(),T=[...new Set(g.map(k=>parts(k)[2]))].sort();
    const c=covers([a],S2,T);
    if(c.length===g.length&&c.every(x=>g.includes(x))){out.push({type:g.length===1?'1点':'フォーメーション',legs:[[a],S2,T]});continue;}
    const byB={};g.forEach(k=>{const b=parts(k)[1];(byB[b]=byB[b]||[]).push(parts(k)[2]);});
    Object.keys(byB).map(Number).sort().forEach(b=>out.push({type:byB[b].length===1?'1点':'流し',legs:[[a],[b],byB[b].sort()]}));
  }
  return out;
}
function betPlan(a,unit){
  const list=a.honsen;if(!list.length)return null;
  const pMin=Math.min(...list.map(c=>c.pAi));
  const rows=list.map(c=>{const mul=Math.max(1,Math.min(MAXMUL,Math.round(c.pAi/pMin)));return {...c,mul,stake:mul*unit};});
  const total=sum(rows.map(x=>x.stake));
  rows.forEach(x=>{x.back=Math.round(x.stake*x.odds);x.gami=x.back<total;});
  const evBack=sum(rows.map(x=>x.pAi*x.back));
  return {rows,total,hitP:a.cover,evBack,forms:toForms(list.map(c=>c.k)),real:!!a.real};
}

    AI本線:a.honsen.map(c=>`${c.k} ${(c.pAi*100).toFixed(1)}%`),AI穴:a.ana.map(c=>`${c.k} ${(c.pAi*100).toFixed(1)}% ${c.real?'オッズ':'推定'}${odds(c.odds)}倍`)};
  const text=`艇読みAIのこのレースを解説して。展開予想、本線と穴の根拠、注意点を短く。\n${JSON.stringify(data)}`;
  const done=()=>toast('コピーしました。Claudeのチャットに貼り付けてください');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));}else fallbackCopy(text,done);
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){toast('コピーできませんでした');}ta.remove();}

/* ============ 買い目計算 ============ */
function calcCombos(){const out=[];
  if(calc.mode==='box'){const s=[...calc.sel[0]];for(const a of s)for(const b of s)for(const c of s)if(a!==b&&b!==c&&a!==c)out.push(a+'-'+b+'-'+c);}
  else{for(const a of calc.sel[0])for(const b of calc.sel[1])for(const c of calc.sel[2])if(a!==b&&b!==c&&a!==c)out.push(a+'-'+b+'-'+c);}
  return out.sort();}
function statsHtml(list,r,a,map){const hitP=a?sum(list.map(k=>map[k]?.pAi||0)):0,back=a?sum(list.map(k=>(map[k]?.pAi||0)*(map[k]?.odds||0)))*calc.stake:0;
  return `<div class="stat"><span>点数</span><b>${list.length}点</b></div><div class="stat"><span>合計金額</span><b>${yen(list.length*calc.stake)}</b></div>${a?`<div class="stat"><span>AI的中確率（${r.rno}R）</span><b>${pct(hitP)}</b></div><div class="stat"><span>推定回収の期待値</span><b>${list.length?Math.round(back/(list.length*calc.stake)*100)+'%':'-'}</b></div>`:''}`;}
const gridHtml=(list,map)=>list.map(k=>`<div class="cg"><span class="nums">${comboHtml(k)}</span>${map[k]?`<span>${pct(map[k].pAi)}・${odds(map[k].odds)}倍</span>`:''}</div>`).join('');
function renderCalc(){
  const el=$('#v-calc'), r=cur(), a=r?A(r):null, map=a?Object.fromEntries(a.combos.map(c=>[c.k,c])):{};
  const rows=calc.mode==='box'?[['ボックス',0]]:[['1着',0],['2着',1],['3着',2]], list=calcCombos();
  el.innerHTML=`<div style="display:grid;gap:16px">
    <div class="panel picker">
      <div class="prow"><span class="seg"><button data-mode="form" aria-pressed="${calc.mode==='form'}">フォーメーション</button><button data-mode="box" aria-pressed="${calc.mode==='box'}">ボックス</button></span>
      <label class="status" for="stake">1点</label><input id="stake" inputmode="numeric" value="${calc.stake}" style="width:80px;font:14px var(--f-num);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><span class="status">円</span></div>
      ${rows.map(([lab,i])=>`<div class="prow"><span class="lab">${lab}</span>${[1,2,3,4,5,6].map(n=>`<button class="tog" data-row="${i}" data-n="${n}" aria-pressed="${calc.sel[i].has(n)}" aria-label="${lab} ${n}号艇">${n}</button>`).join('')}</div>`).join('')}
      <div class="prow"><button class="btn ghost" id="fill-h" type="button"${a?'':' disabled'}>AI本線を読み込む</button><button class="btn ghost" id="fill-a" type="button"${a?'':' disabled'}>AI穴を読み込む</button></div>
      <div class="field"><label for="paste">買い目を貼り付けて計算（例：1-23-234, 2-1-3）</label><textarea id="paste" placeholder="一撃くんやChatGPTの買い目を貼ると、点数・金額を計算します"></textarea></div>
    </div>
    <div class="stats" id="cstats">${statsHtml(list,r,a,map)}</div>
    <div class="combo-grid" id="cgrid">${gridHtml(list,map)}</div>
    ${a?`<p class="hint">確率と倍率は${esc(r.venue||'')}${r.rno}Rの推定値です。倍率は人気の推定で、実際のオッズとは違います。</p>`:''}
  </div>`;
  const showList=ks=>{$('#cstats').innerHTML=statsHtml(ks,r,a,map);$('#cgrid').innerHTML=gridHtml(ks,map);el.querySelectorAll('.tog').forEach(b=>b.setAttribute('aria-pressed','false'));};
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{calc.mode=b.dataset.mode;renderCalc();});
  el.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const s=calc.sel[+b.dataset.row],n=+b.dataset.n;s.has(n)?s.delete(n):s.add(n);renderCalc();});
  $('#stake').onchange=e=>{calc.stake=Math.max(100,Math.round((num(e.target.value)||100)/100)*100);renderCalc();};
  if(a){$('#fill-h').onclick=()=>showList(a.honsen.map(c=>c.k));$('#fill-a').onclick=()=>showList(a.ana.map(c=>c.k));}
  $('#paste').oninput=e=>{const ks=parsePicks(e.target.value);if(ks.length)showList(ks);};
}

/* ============ 成績（今見ている日付のレース） ============ */
function learnPanel(){
  if(!REPORT)return `<div class="panel"><h3>AIの学習状況</h3><p class="sub">過去データでの学習はまだです。学習が終わるとここに成績が出ます。</p></div>`;
  const t=REPORT.test, h=t.honsen, a=t.ana, d=s=>s?`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`:'';
  return `<div class="panel"><h3>AIの学習状況</h3>
    <p class="sub">${d(REPORT.period.from)}〜${d(REPORT.period.to)}の${REPORT.races.all.toLocaleString()}レースで学習。下の成績は、学習に使っていない${d(REPORT.period.testFrom)}以降の${REPORT.races.test.toLocaleString()}レースで試した結果です（1点100円・実際の払戻）。</p>
    <div class="stats">
      <div class="stat"><span>1着の的中率</span><b>${pct(t.winTopHit)}</b></div>
      <div class="stat"><span>本線の的中率</span><b>${pct(h.hitRate)}</b></div>
      <div class="stat"><span>本線の回収率</span><b>${Math.round(h.roi*100)}%</b></div>
      <div class="stat"><span>穴の的中率</span><b>${pct(a.hitRate)}</b></div>
      <div class="stat"><span>穴の回収率</span><b>${Math.round(a.roi*100)}%</b></div>
    </div>
    <p class="hint">学習日 ${esc((REPORT.trainedAt||'').slice(0,10))}。毎週月曜に最新のデータで学習し直します。</p></div>`;
}
function renderRec(){
  const el=$('#v-rec');
  const done=races.filter(r=>{const x=resultOf(r);return x&&x.order&&A(r);});
  if(!done.length){el.innerHTML=learnPanel()+`<div class="empty" style="margin-top:16px"><b>${fmtDate(dateSel)}はまだ結果の入ったレースがありません。</b><br>結果はレース後に自動で入ります。AI本線・AI穴・ChatGPT・一撃くん・自分の回収率をここで比べます。</div>`;return;}
  const aiH=r=>history[r.id]?.h||A(r).honsen.map(c=>c.k), aiA=r=>history[r.id]?.a||A(r).ana.map(c=>c.k);
  const srcs=[['AI本線',aiH],['AI穴',aiA],['ChatGPT',r=>parsePicks(picks[r.id]?.chatgpt)],['一撃くん',r=>parsePicks(picks[r.id]?.ikkun)],['自分',r=>parsePicks(picks[r.id]?.mine)]];
  const agg=srcs.map(([name,f])=>{let n=0,pts=0,ret=0,hits=0;done.forEach(r=>{const ks=f(r),x=resultOf(r);if(!ks.length)return;n++;pts+=ks.length;if(ks.includes(x.order)){hits++;ret+=x.payout||0;}});return {name,n,pts,ret,hits};});
  el.innerHTML=`<div style="display:grid;gap:16px">${learnPanel()}
    <div><p class="card-title">${fmtDate(dateSel)}の回収率（1点100円・${done.length}レース）</p><div class="tablebox"><table class="rec">
      <thead><tr><th>予想</th><th>レース数</th><th>的中</th><th>的中率</th><th>投資</th><th>払戻</th><th>回収率</th></tr></thead>
      <tbody>${agg.map(g=>`<tr><td class="src">${g.name}</td><td>${g.n}</td><td>${g.hits}</td><td>${g.n?pct(g.hits/g.n):'-'}</td><td>${yen(g.pts*100)}</td><td>${yen(g.ret)}</td><td class="${g.pts&&g.ret>=g.pts*100?'hit':''}">${g.pts?Math.round(g.ret/(g.pts*100)*100)+'%':'-'}</td></tr>`).join('')}</tbody></table></div></div>
    <div><p class="card-title">レースごと</p><div class="tablebox"><table class="rec">
      <thead><tr><th>レース</th><th>結果</th><th>払戻</th><th>AI本線</th><th>AI穴</th><th>ChatGPT</th><th>一撃くん</th><th>自分</th></tr></thead>
      <tbody>${done.sort((a,b)=>a.jcd-b.jcd||a.rno-b.rno).map(r=>{const x=resultOf(r);return `<tr><td class="src">${esc(r.venue||VENUES[r.jcd])}${r.rno}R</td><td>${esc(x.order)}</td><td>${yen(x.payout)}</td>${srcs.map(([,f])=>{const ks=f(r);return `<td>${!ks.length?'-':ks.includes(x.order)?'<span class="hit">的中</span>':'×'}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>
    <p class="hint">AIの本線・穴は、締切時点でこの端末に記録した買い目で数えます（記録前のレースは今のデータで計算）。</p>
  </div>`;
}

/* ============ 起動 ============ */
$('#date').addEventListener('change',e=>{dateSel=e.target.value;raceId=null;loadDay();});
$('#venue').addEventListener('change',e=>{jcdSel=+e.target.value;LS.set('jcd',jcdSel);raceId=null;renderChips();renderView();});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;raceId=b.dataset.id;renderChips();renderView();});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;LS.set('view',view);renderView();}));
(async()=>{
  let m=null;
  try{m=await fetchJSON('model.json');}catch(_){try{m=await fetch('model.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);}catch(_){}}
  if(m)MODEL={...MODEL,...m,weights:{...MODEL.weights,...(m.weights||{})},market:{...MODEL.market,...(m.market||{}),cls:{...MODEL.market.cls,...((m.market||{}).cls||{})}},ana:{...MODEL.ana,...(m.ana||{})}};
  try{REPORT=await fetchJSON('report.json');}catch(_){}
  await loadIndex();await loadDay();
  setInterval(async()=>{if(document.hidden||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;const keep=raceId;await loadDay();raceId=keep;renderChips();},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDay();});
})();
</script>
</body>
</html>
