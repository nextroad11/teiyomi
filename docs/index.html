<style>
/* Layout: 出走表を中心にした一列の作業画面。上に日付・場・レース選択、下に本線/穴、出走表、記録 */
:root{
  --bg:#eef3f5; --surface:#ffffff; --sunk:#e3ebef; --ink:#0d1f2b; --muted:#566b77; --line:#d2dde3;
  --accent:#0b5cad; --accent-soft:#dbe9f7; --ana:#c2410c; --ana-soft:#fbe6da;
  --good:#15803d; --good-soft:#dcf1e3;
  --b1:#ffffff; --b1f:#111; --b2:#1b1b1b; --b2f:#fff; --b3:#d62839; --b3f:#fff;
  --b4:#1f56d6; --b4f:#fff; --b5:#f2c40f; --b5f:#111; --b6:#138a43; --b6f:#fff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0a141b; --surface:#111e27; --sunk:#0d1820; --ink:#e4edf2; --muted:#8fa3ae; --line:#233440;
  --accent:#62a8f2; --accent-soft:#132b42; --ana:#f39257; --ana-soft:#3a2216;
  --good:#4ccb7f; --good-soft:#12301f; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;margin:0;display:flex;align-items:baseline;gap:8px;font-weight:400}
.brand small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:3px;border-radius:9px}

.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.wrap{padding-block:16px 48px;display:grid;gap:18px}
.meetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meetbar select{font:700 15px var(--f-body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.meetbar .note{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;font-family:var(--f-body);min-width:74px}
.chip b{font-family:var(--f-num);font-size:15px;display:block;line-height:1.2}

.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.racehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.racehead h2{font-family:var(--f-display);font-size:26px;margin:0;font-weight:400;text-wrap:balance}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.kata{background:var(--good-soft);color:var(--good)}
.pill.futsu{background:var(--accent-soft);color:var(--accent)}
.pill.are{background:var(--ana-soft);color:var(--ana)}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 .mark{font-family:var(--f-display);font-weight:400;font-size:13px;padding:2px 8px;border-radius:6px;color:var(--surface)}
.honsen h3 .mark{background:var(--accent)} .ana h3 .mark{background:var(--ana)}
.panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.combo-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.combo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-variant-numeric:tabular-nums}

.combo .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.combo .bar span{display:block;height:100%;background:var(--accent)}
.ana .combo .bar span{background:var(--ana)}
.combo .val{font-family:var(--f-num);font-size:13px;text-align:right;white-space:nowrap}
.combo .val small{color:var(--muted);font-size:11px;margin-left:6px}
.combo.hit .nums{outline:2px solid var(--good);outline-offset:2px;border-radius:4px}
.foot-cell{white-space:nowrap;text-align:center}
.tablebox{max-width:100%;overflow-x:auto}
#v-yoso>div>*,#v-self>div>*{min-width:0}.foot-cell span{display:block;font-size:11px;color:var(--muted)}
.fg{font-size:16px}.fg-up{color:var(--good)}.fg-dn{color:var(--ana)}.fg-mid{color:var(--muted)}
.tenkai{display:grid;gap:14px}
.slit svg{width:100%;height:auto;display:block}
.slit .lane{fill:var(--bg)} .slit .line{stroke:var(--ana);stroke-width:2;stroke-dasharray:4 3}
.slit text{font:11px var(--f-num);fill:var(--muted)}
.slit .st{font:600 11px var(--f-num);fill:var(--ink)}
.slit .mk-dn{fill:var(--ana);font-weight:700} .slit .mk-up{fill:var(--good);font-weight:700}
.slit .bnr1{fill:var(--b1);stroke:var(--line)} .slit .bnt1{fill:var(--b1f);font:600 12px var(--f-num)}
.slit .bnr2{fill:var(--b2);stroke:var(--line)} .slit .bnt2{fill:var(--b2f);font:600 12px var(--f-num)}
.slit .bnr3{fill:var(--b3);stroke:var(--line)} .slit .bnt3{fill:var(--b3f);font:600 12px var(--f-num)}
.slit .bnr4{fill:var(--b4);stroke:var(--line)} .slit .bnt4{fill:var(--b4f);font:600 12px var(--f-num)}
.slit .bnr5{fill:var(--b5);stroke:var(--line)} .slit .bnt5{fill:var(--b5f);font:600 12px var(--f-num)}
.slit .bnr6{fill:var(--b6);stroke:var(--line)} .slit .bnt6{fill:var(--b6f);font:600 12px var(--f-num)}
.scen{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.scen li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.scen .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.scen .bar span{display:block;height:100%;background:var(--accent)}
.scen li>span{display:grid;gap:3px}.scen b{font-variant-numeric:tabular-nums}
.tk-text{font-size:13px;line-height:1.7;margin:0}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}.lockbox{display:grid;gap:12px;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.lockbox h2{margin:0}.lockbox p{margin:0;color:var(--muted);font-size:13px}
.lockbox input{font:16px var(--f-num);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lockmsg{min-height:1.2em;color:var(--ana)!important}
.ashi td.pos{color:var(--good);font-weight:600}.ashi td.neg{color:var(--ana)}
.ori td small{display:inline-block;margin-left:4px;font-size:10px;color:var(--muted)}
/* オリ展の色分け: 1位 濃い緑 / 2位 うすい緑 / 5位 うすい赤 / 6位 濃い赤（補正後のレース内順位） */
.ori td.rk1{background:color-mix(in srgb,var(--good) 30%,transparent);font-weight:700}
.ori td.rk2{background:color-mix(in srgb,var(--good) 13%,transparent)}
.ori td.rk5{background:color-mix(in srgb,var(--ana) 17%,transparent)}
.ori td.rk6{background:color-mix(in srgb,var(--ana) 30%,transparent)}
.ori td.rk1 small,.ori td.rk2 small{color:var(--good);font-weight:700}.ori td.rk5 small,.ori td.rk6 small{color:var(--ana);font-weight:700}
.ori .legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;font-size:11px}
.ori .legend span{padding:2px 8px;border-radius:6px}.ori td em{display:block;font-style:normal;font-size:10px;color:var(--muted)}
.expect{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 10px;border-radius:10px;background:var(--bg);margin:2px 0 10px}
.expect .lbl{font-size:12px;color:var(--muted);font-weight:600}.expect .num{font-size:12px;color:var(--muted)}
.expect .stars{letter-spacing:1px}
.ex-hi{background:color-mix(in srgb,var(--good) 16%,transparent)}.ex-hi b{color:var(--good)}
.ex-lo b{color:var(--muted)}
.man-hi{background:color-mix(in srgb,var(--ana) 18%,transparent)}.man-hi b{color:var(--ana)}
.man-lo b{color:var(--muted)}
.pill.exp-hi{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.exp-mid,.pill.exp-lo{background:var(--bg);color:var(--muted)}
.pill.man-hi{color:var(--ana)}
.arep .mark{background:var(--ana);color:#fff}
.km-cell{min-width:160px}
td.who{min-width:6.5em}td.who b{white-space:nowrap}td.who span{white-space:nowrap}.km{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.km span small{margin-left:2px;font-size:10px;color:var(--muted)}.km .km-hi{color:var(--good);font-weight:700}.km .km-hi small{color:var(--good)}
.km .km-lo{color:var(--muted)}.km-n,.km-na{display:block;font-size:10px;color:var(--muted)}
.cdata td small{display:block;font-size:10px;color:var(--muted)}
.cdata .cd-hi,.cdata td.cd-hi{color:var(--good);font-weight:700}.cdata td.cd-hi{background:color-mix(in srgb,var(--good) 12%,transparent)}
.cdata .cd-lo,.cdata td.cd-lo{color:var(--muted)}.cdata .cd-few{color:var(--muted);font-style:italic}.cdata .cd-na{color:var(--muted);font-size:12px}
.cdata .cd-km{white-space:nowrap;font-size:12px}.cdata .cd-km span{margin-right:6px}.cdata .cd-strong{color:var(--ana);font-weight:700}
.cdata .cd-base{font-size:11px;color:var(--muted);text-align:left}
.change ul{margin:4px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13px}.change b.up{color:var(--good)}.change b.dn{color:var(--ana)}
.change .cmb{display:inline-flex;margin:2px 8px 2px 0;vertical-align:middle}
.change.big{border-color:var(--ana);background:color-mix(in srgb,var(--ana) 8%,var(--surface))}
.plan .forms{display:grid;gap:6px;margin:4px 0 12px}
.plan .form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:600}
.plan .form .lbl{font-size:12px;font-weight:600;color:var(--muted);min-width:5.5em}
.plan .form .arrow{color:var(--muted)}
.plan table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.plan td,.plan th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
.plan th{font-size:11px;color:var(--muted);font-weight:600}
.plan td:first-child,.plan th:first-child{text-align:left}
.plan tr.big td{font-weight:700}
.plan .warn{color:var(--ana)}
.plan .unit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
.plan .unit select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.panel .foot{margin-top:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:600 13px var(--f-num);border:1px solid var(--line)}
.bn[data-n="1"]{background:var(--b1);color:var(--b1f)} .bn[data-n="2"]{background:var(--b2);color:var(--b2f)}
.bn[data-n="3"]{background:var(--b3);color:var(--b3f);border-color:transparent} .bn[data-n="4"]{background:var(--b4);color:var(--b4f);border-color:transparent}
.bn[data-n="5"]{background:var(--b5);color:var(--b5f);border-color:transparent} .bn[data-n="6"]{background:var(--b6);color:var(--b6f);border-color:transparent}
.bn.lg{width:30px;height:30px;font-size:16px;border-radius:7px}
.comment{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.comment p{margin:0;max-width:68ch}
.btn{font:700 13px var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.card-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.card th,.card td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.card th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--sunk)}
.card tr:last-child td{border-bottom:0}

<body>
<header class="top"><div class="wrap">
  <h1 class="brand">艇読みAI <small>BOATRACE ANALYZER</small></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-yoso" aria-selected="true" data-view="yoso">予想</button>
    <button role="tab" id="tab-self" aria-selected="false" data-view="self">自分で予想</button>
    <button role="tab" id="tab-calc" aria-selected="false" data-view="calc">買い目計算</button>

  </nav>
</div></header>

<div id="lock" class="lock" hidden><form id="lockf" class="lockbox">

  <button class="btn" type="submit">ひらく</button><p id="lockmsg" class="lockmsg" role="status"></p></form></div>

  <div class="meetbar">

    <span class="note" id="loadnote">データを読み込み中…</span>

  <div class="chips" id="chips" role="group" aria-label="レースを選ぶ"></div>
  <section id="v-yoso"></section>

  const ORI=race.before&&race.before.ori, OF=oriFeats(ORI);
  const boats=B.map((b,i)=>{
    const course=clamp(num(ex[b.waku].course)||b.waku,1,6);
    const nat=num(b.natWin)??5.0, loc=num(b.locWin), locEff=(loc&&loc>0)?loc:nat;
    const m2=num(b.motor2)>0?num(b.motor2):33, b2=num(b.boat2)>0?num(b.boat2):33, st=num(b.st)??0.17, f=num(b.f)||0;
    const parts={skill:w.skill*(nat-5.5)/1.2, local:w.local*(locEff-nat)/1.2, motor:w.motor*(m2-35)/8, boat:w.boat*(b2-33)/6,
      st:-w.st*clamp((st-0.16)/0.025,-2.5,2.5), ex:(exMean!=null&&exT[i]!=null)?-w.ex*clamp((exT[i]-exMean)/0.07,-2.5,2.5):0,
      cwin:(w.cwin||0)*cwinOf(b.toban,course), form:(w.form||0)*formOf(STATS&&STATS.p[String(b.toban)]?.rf.slice(-10),3),
      mform:(w.mform||0)*formOf(STATS&&STATS.m[`${race.jcd}-${b.motor}`]?.slice(-20),5),
      olap:(w.olap||0)*OF[b.waku][0], oturn:(w.oturn||0)*OF[b.waku][1], ostr:(w.ostr||0)*OF[b.waku][2]};
    const s=sum(Object.values(parts)), fPen=f>0?-w.fPen:0;
    const mk=MODEL.market, exF=(exMean!=null&&exT[i]!=null)?-clamp((exT[i]-exMean)/0.07,-2.5,2.5):0;
    const sm=mk.kNat*(nat-5.5)/1.2+mk.kMotor*(m2-35)/8+mk.kEx*exF+(mk.cls[b.cls]??0);
    const tags=[];
    if(m2Mean!=null&&m2>=m2Mean+5)tags.push(['plus','モーター上位']);
    if(m2Mean!=null&&m2<=m2Mean-5)tags.push(['minus','モーター劣勢']);
    if(loc&&loc>=nat+0.4)tags.push(['plus','当地巧者']);
    if(loc&&loc>0&&loc<=nat-0.8)tags.push(['minus','当地苦戦']);
    if(STATS){const cv=cwinOf(b.toban,course),fv=formOf(STATS.p[String(b.toban)]?.rf.slice(-10),3),mv=formOf(STATS.m[`${race.jcd}-${b.motor}`]?.slice(-20),5);
      if(cv>=0.8)tags.push(['plus',course+'コース得意']);else if(cv<=-0.8)tags.push(['minus',course+'コース苦手']);
      if(fv>=0.5)tags.push(['plus','好調']);else if(fv<=-0.5)tags.push(['minus','不調']);
      if(mv>=0.45)tags.push(['plus','機力上昇']);}
    if(st<=0.13)tags.push(['plus','ST速い']); if(st>=0.18)tags.push(['minus','ST遅め']);
    if(f>0)tags.push(['minus','F'+f+'持ち']);
    if(exBest!=null&&exT[i]===exBest)tags.push(['plus','展示1位']);
    if(course!==b.waku)tags.push(['',course+'コース進入']);
    return {...b,course,parts,s,exTime:exT[i],tilt:num(ex[b.waku].tilt),tags,
      winW:Math.exp(Math.log(base[course-1])+w.kWin*(s+fPen)), plW:Math.exp(Math.log(PLACE[course-1])+w.kPlace*s),

  const ai=trifecta(boats,'winW','plW'), mkP=trifecta(boats,'mWinW','mPlW');
  // 舟足評価: 展示タイム・モーター2連率・モーターの直近成績を、学習した重みで足したもの
  // 学習した重みがまだ無いうちは、オリジナル展示は控えめな仮の重み(0.15)で舟足に入れる
  boats.forEach(b=>{const o=OF[b.waku],ww=MODEL.weights;b.foot=(b.parts.ex||0)+(b.parts.motor||0)+(b.parts.mform||0)
    +(ww.olap!=null?b.parts.olap:0.15*o[0])+(ww.oturn!=null?b.parts.oturn:0.15*o[1])+(ww.ostr!=null?b.parts.ostr:0.15*o[2]);});

  else{const fm=avg(boats.map(b=>b.foot)),ord=boats.slice().sort((x,y)=>y.foot-x.foot);
    boats.forEach(b=>{const r=ord.indexOf(b),d=b.foot-fm;b.footGrade=d>=0.35&&r===0?'◎':d>=0.15&&r<=1?'○':d<=-0.3?'×':d<=-0.12?'▲':'△';});}

  boats.forEach(b=>{b.pWin=b.winW/W;});

  const real=realOdds(race);

    if(real&&real.map[k]){const odds=real.map[k],pMk=(1/odds)/real.inv;return {k,pAi,pMk,odds,ev:pAi*odds,ratio:pAi/pMk,real:true};}

  return {boats,combos,honsen,ana,cover:cum,top,topWin,real,manP,ashi:AS?{kind:ASHI_W[Number(race.jcd)]?'場別':'既定',sep:ASHI_SEP[Number(race.jcd)]??null,venueCorr:!!ASHI_CONFIG.corrVenue[Number(race.jcd)],notes:AS.notes||[]}:null,level:topWin>=0.6?'kata':topWin>=0.42?'futsu':'are',hasEx:exMean!=null};

// 金額つきの買い目: 「1-3-2 300」「132 135 341 300円」「1-23-234:200」など。金額は直前の買い目まとめてに付く。無ければ100円
function parseBets(str){
  const out={};
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-').replace(/[：@×xX]/g,' ').replace(/[円¥￥]/g,' ').replace(/(\d),(\d{3})/g,'$1$2');
  let pend=[];
  const flush=amt=>{pend.forEach(k=>{out[k]=(out[k]||0)+amt;});pend=[];};
  norm.split(/[\s,、，・/]+/).filter(Boolean).forEach(tok=>{
    if(/^\d+$/.test(tok)&&(tok.includes('0')||tok.length>=4||!/^[1-6]{3}$/.test(tok))){if(pend.length)flush(+tok);return;}
    const g=tok.includes('-')?tok.split('-'):(/^[1-6]{3}$/.test(tok)?[...tok]:null);if(!g||g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)pend.push(a+'-'+b+'-'+c);});
  flush(100);
  return out;
}
function parsePicks(str){return Object.keys(parseBets(str));}
function parsePicksOld(str){
  const set=new Set();
  const norm=(str||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[ー－―−＝=]/g,'-');
  norm.split(/[\s,、，・/]+/).forEach(tok=>{const g=tok.split('-');if(g.length!==3)return;
    const gs=g.map(x=>[...x].map(Number).filter(n=>n>=1&&n<=6));
    for(const a of gs[0])for(const b of gs[1])for(const c of gs[2])if(a!==b&&b!==c&&a!==c)set.add(a+'-'+b+'-'+c);});
  return [...set];
}

function kmDist(jcd,c){const K=STATS&&STATS.km;const all=K&&K.all&&K.all[c],v=K&&K.v&&K.v[jcd]&&K.v[jcd][c];
  if(!all)return KM_DEFAULT[c];const na=sum(Object.values(all)),pa={};for(const k in all)pa[k]=all[k]/na;if(!v)return pa;
  const nv=sum(Object.values(v)),out={};for(const k of new Set([...Object.keys(pa),...Object.keys(v)]))out[k]=((v[k]||0)+20*(pa[k]||0))/(nv+20);return out;}
function slitOf(r,a){

  const rows=a.boats.map(b=>{const q=bf[b.waku]||{},hist=STATS&&STATS.p[String(b.toban)]?.st;
    const base=hist&&hist.length>=5?avg(hist):num(b.st)??0.17, sd=hist&&hist.length>=5?Math.sqrt(avg(hist.map(x=>(x-base)**2))):null;
    // 過去13万スタートで一番当たった方法: その選手のこのコースでのST（少ないときは全体平均に寄せる）＋場・コースのクセ
    const V=STATS&&STATS.stv,allm=V?avg(Object.values(V)):null,vm=V&&V[`${r.jcd}-${b.course}`];
    const adj=base+((vm!=null&&allm!=null)?vm-allm:0), hc=(STATS&&STATS.p[String(b.toban)]?.stc||[])[b.course-1]||[];

  return rows;}

// ---------------------------------------------------------------- 荒れ狙いフォーメーション（50倍以上の決着を12点以内で押さえる）
// 11/5〜7の411R（公式オッズあり）で確認: 万舟期待「高い」レースで的中19.6%・回収123%（51R・10本的中なので参考）。
// それより自信の低いレースでは回収54%、全レースで買うと56%なので、万舟期待「高い」レースだけ出す
const ARE_CAL=0.69; // AIの「50倍以上になる確率」は高く出る（予測38%→実際27%）ので補正
const subsets=max=>{const r=[];for(let m=1;m<64;m++){const s=[1,2,3,4,5,6].filter((_,i)=>m>>i&1);if(s.length<=max)r.push(s);}return r;};
const SUB2=subsets(2),SUB4=subsets(4);
// 点数は4〜12点で自由。「1点増やすなら、50倍以上が当たる確率を1%以上増やすこと」で決める
// （50倍以上の平均配当は約100倍なので、1点あたり1%が損益の分かれ目）。3日分の試しで平均7.4点・回収156%（12点固定は123%）
const ARE_LAMBDA=0.010;
function areForm(a){
  const P={};a.combos.forEach(c=>P[c.k]=c);let best=null;
  for(const F of SUB2)for(const S of SUB4)for(const T of SUB4){let pts=0,c50=0;const ks=[];
    for(const x of F)for(const y of S)for(const z of T){if(x===y||y===z||x===z)continue;pts++;if(pts>12)break;const k=x+'-'+y+'-'+z;ks.push(k);if(P[k].odds>=50)c50+=P[k].pAi;}
    if(pts>12||pts<4)continue;const sc=c50-ARE_LAMBDA*pts;if(!best||sc>best.sc+1e-9)best={F,S,T,pts,c50,ks,sc};}
  return best;}
function areHtml(r,a,res){
  const p50raw=sum(a.combos.filter(c=>c.odds>=50).map(c=>c.pAi)),p50=clamp(ARE_CAL*p50raw,0,0.8);
  // 「やや高い」帯（素の50倍以上確率45%以上だが万舟期待は高くない）は3日で回収54%だったので出さない
  const conf=a.manP>=0.20?'高':null;
  if(!conf)return '';
  const B=areForm(a);if(!B)return '';
  const P={};a.combos.forEach(c=>P[c.k]=c);const unit=LS.get('unit',1000)>0?LS.get('unit',1000):100;
  const leg=l=>l.map(n=>bn(n)).join('');
  const rows=B.ks.map(k=>P[k]).sort((x,y)=>y.pAi-x.pAi);
  return `<div class="panel arep"><h3><span class="mark">荒れ狙い</span>50倍以上を12点以内で狙うフォーメーション（参考）</h3>
    <div class="expect man-hi"><span class="lbl">荒れる自信</span><b>高い</b><span class="num">50倍以上で決まる確率 ${pct(p50)}（全レースの平均は約27%）</span></div>
    <div class="forms plan"><div class="form"><span class="lbl">フォーメーション${B.pts}点</span>${leg(B.F)}<span class="arrow">→</span>${leg(B.S)}<span class="arrow">→</span>${leg(B.T)}</div></div>
    <ul class="combo-list">${rows.map(c=>`<li class="combo${res&&res.order===c.k?' hit':''}"><span class="nums">${comboHtml(c.k)}</span><span class="bar"><span style="width:${Math.min(100,c.pAi/rows[0].pAi*100)}%"></span></span><span class="val">${pct(c.pAi)}<small>${c.real?'':'推定'}${odds(c.odds)}倍${c.odds<50?'・50倍未満':''}</small></span></li>`).join('')}</ul>
    <p class="foot">1点${yen(unit)}なら合計${yen(unit*B.pts)}。50倍以上の決着の${pct(B.c50/p50raw)}をこの${B.pts}点で押さえます。点数は4〜12点で、押さえる確率が1点あたり1%以上増えるところまで。<b>注意：11/5〜11の1週間（149レース）では的中10本・回収52%で負けています。</b>最初の3日の好成績（回収156%）はたまたまでした。11/19に作り直すまで、買うときは参考程度に。</p></div>`;}

// ---------------------------------------------------------------- 展示で変わったこと（展示前＝出走表だけの予想と比べる）
function changeHtml(r,a){

  if(!items.length)return `<div class="panel change"><h3>展示で変わったこと</h3><p class="sub">展示前（出走表だけ）の予想から大きな変化はありません。</p></div>`;
  return `<div class="panel change${big?' big':''}"><h3>${big?'⚠️ 展示で大きく変わりました':'展示で変わったこと'}</h3><p class="sub">展示前（出走表だけ）の予想と、展示・進入・オリジナル展示を入れた今の予想の違い。${big?'大きく変わったレースは荒れやすく、11/5〜7では本線の的中29%（ふだんは40%）でした。':''}</p><ul>${items.join('')}</ul></div>`;
}

// ---------------------------------------------------------------- 買い方（フォーメーション・BOX・金額配分）
const MAXMUL=5;
function toForms(keys){
  const ks=[...new Set(keys)], parts=k=>k.split('-').map(Number), out=[];
  const boats=[...new Set(ks.flatMap(parts))];
  if(boats.length===3&&ks.length===6)return [{type:'BOX',legs:[boats.sort()]}];
  const covers=(f,s2,t)=>{const r=[];f.forEach(a=>s2.forEach(b=>t.forEach(c=>{if(a!==b&&b!==c&&a!==c)r.push(`${a}-${b}-${c}`)})));return r;};
  // 1着ごとにまとめ、2着×3着の形でぴったり表せればフォーメーション、だめなら1・2着ごとにまとめる
  const byA={};ks.forEach(k=>{const [a]=parts(k);(byA[a]=byA[a]||[]).push(k);});
  for(const a of Object.keys(byA).map(Number).sort()){
    const g=byA[a],S2=[...new Set(g.map(k=>parts(k)[1]))].sort(),T=[...new Set(g.map(k=>parts(k)[2]))].sort();
    const c=covers([a],S2,T);
    if(c.length===g.length&&c.every(x=>g.includes(x))){out.push({type:g.length===1?'1点':'フォーメーション',legs:[[a],S2,T]});continue;}
    const byB={};g.forEach(k=>{const b=parts(k)[1];(byB[b]=byB[b]||[]).push(parts(k)[2]);});
    Object.keys(byB).map(Number).sort().forEach(b=>out.push({type:byB[b].length===1?'1点':'流し',legs:[[a],[b],byB[b].sort()]}));
  }
  return out;
}
// unit が正なら「1点の基本」、負なら「1レースの予算」（例: -3000 = 3,000円を配分）
function betPlan(a,unit,list){
  list=list||a.honsen;if(!list.length)return null;
  const pMin=Math.min(...list.map(c=>c.pAi));
  const rows=list.map(c=>({...c,mul:Math.max(1,Math.min(MAXMUL,Math.round(c.pAi/pMin)))}));
  if(unit>0)rows.forEach(x=>x.stake=x.mul*unit);
  else{const B=-unit,M=sum(rows.map(x=>x.mul));rows.forEach(x=>x.stake=Math.max(100,Math.floor(B*x.mul/M/100)*100));
    let left=B-sum(rows.map(x=>x.stake));for(const x of rows.slice().sort((p,q)=>q.pAi-p.pAi)){if(left<100)break;x.stake+=100;left-=100;}}
  const total=sum(rows.map(x=>x.stake));
  rows.forEach(x=>{x.back=Math.round(x.stake*x.odds);x.gami=x.back<total;});
  const evBack=sum(rows.map(x=>x.pAi*x.back));
  return {rows,total,hitP:a.cover,evBack,forms:toForms(list.map(c=>c.k)),real:!!a.real};
}

    <div class="panel picker">
      <div class="prow"><span class="seg"><button data-mode="form" aria-pressed="${calc.mode==='form'}">フォーメーション</button><button data-mode="box" aria-pressed="${calc.mode==='box'}">ボックス</button></span>
      <label class="status" for="stake">1点</label><input id="stake" inputmode="numeric" value="${calc.stake}" style="width:80px;font:14px var(--f-num);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><span class="status">円</span></div>
      ${rows.map(([lab,i])=>`<div class="prow"><span class="lab">${lab}</span>${[1,2,3,4,5,6].map(n=>`<button class="tog" data-row="${i}" data-n="${n}" aria-pressed="${calc.sel[i].has(n)}" aria-label="${lab} ${n}号艇">${n}</button>`).join('')}</div>`).join('')}
      <div class="prow"><button class="btn ghost" id="fill-h" type="button"${a?'':' disabled'}>AI本線を読み込む</button><button class="btn ghost" id="fill-a" type="button"${a?'':' disabled'}>AI穴を読み込む</button></div>
      <div class="field"><label for="paste">買い目を貼り付けて計算（例：1-23-234, 2-1-3）</label><textarea id="paste" placeholder="一撃くんやChatGPTの買い目を貼ると、点数・金額を計算します"></textarea></div>
    </div>
    <div class="stats" id="cstats">${statsHtml(list,r,a,map)}</div>
    <div class="combo-grid" id="cgrid">${gridHtml(list,map)}</div>
    ${a?`<p class="hint">確率と倍率は${esc(r.venue||'')}${r.rno}Rの推定値です。倍率は人気の推定で、実際のオッズとは違います。</p>`:''}
  </div>`;
  const showList=ks=>{$('#cstats').innerHTML=statsHtml(ks,r,a,map);$('#cgrid').innerHTML=gridHtml(ks,map);el.querySelectorAll('.tog').forEach(b=>b.setAttribute('aria-pressed','false'));};
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{calc.mode=b.dataset.mode;renderCalc();});
  el.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const s=calc.sel[+b.dataset.row],n=+b.dataset.n;s.has(n)?s.delete(n):s.add(n);renderCalc();});
  $('#stake').onchange=e=>{calc.stake=Math.max(100,Math.round((num(e.target.value)||100)/100)*100);renderCalc();};
  if(a){$('#fill-h').onclick=()=>showList(a.honsen.map(c=>c.k));$('#fill-a').onclick=()=>showList(a.ana.map(c=>c.k));}
  $('#paste').oninput=e=>{const ks=parsePicks(e.target.value);if(ks.length)showList(ks);};
}

/* ============ 成績（今見ている日付のレース） ============ */
function learnPanel(){
  if(!REPORT)return `<div class="panel"><h3>AIの学習状況</h3><p class="sub">過去データでの学習はまだです。学習が終わるとここに成績が出ます。</p></div>`;
  const t=REPORT.test, h=t.honsen, a=t.ana, d=s=>s?`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`:'';
  return `<div class="panel"><h3>AIの学習状況</h3>
    <p class="sub">${d(REPORT.period.from)}〜${d(REPORT.period.to)}の${REPORT.races.all.toLocaleString()}レースで学習。下の成績は、学習に使っていない${d(REPORT.period.testFrom)}以降の${REPORT.races.test.toLocaleString()}レースで試した結果です（1点100円・実際の払戻）。</p>
    <div class="stats">
      <div class="stat"><span>1着の的中率</span><b>${pct(t.winTopHit)}</b></div>
      <div class="stat"><span>本線の的中率</span><b>${pct(h.hitRate)}</b></div>
      <div class="stat"><span>本線の回収率</span><b>${Math.round(h.roi*100)}%</b></div>
      <div class="stat"><span>穴の的中率</span><b>${pct(a.hitRate)}</b></div>
      <div class="stat"><span>穴の回収率</span><b>${Math.round(a.roi*100)}%</b></div>
    </div>
    <p class="hint">学習日 ${esc((REPORT.trainedAt||'').slice(0,10))}。毎週月曜に最新のデータで学習し直します。</p></div>`;
}
function renderRec(){
  const el=$('#v-rec');
  const done=races.filter(r=>{const x=resultOf(r);return x&&x.order&&A(r);});
  if(!done.length){el.innerHTML=learnPanel()+`<div class="empty" style="margin-top:16px"><b>${fmtDate(dateSel)}はまだ結果の入ったレースがありません。</b><br>結果はレース後に自動で入ります。AI本線・AI穴・ChatGPT・一撃くん・自分の回収率をここで比べます。</div>`;return;}
  // AIは「買い方」と同じ配分（予算・基本額の設定どおり）、他の予想は入力した金額で数える
  const unit=LS.get('unit',1000);
  const aiBets=(r,keys)=>{const a=A(r),m=Object.fromEntries(a.combos.map(c=>[c.k,c]));const P=betPlan(a,unit,keys.map(k=>m[k]).filter(Boolean));return P?Object.fromEntries(P.rows.map(x=>[x.k,x.stake])):{};};
  const aiH=r=>aiBets(r,history[r.id]?.h||A(r).honsen.map(c=>c.k)), aiA=r=>{const ks=history[r.id]?.a||A(r).ana.map(c=>c.k);return Object.fromEntries(ks.map(k=>[k,unit>0?unit:100]));};
  const srcs=[['AI本線',aiH],['AI穴',aiA],['ChatGPT',r=>parseBets(pk(r.id).chatgpt)],['一撃くん',r=>parseBets(pk(r.id).ikkun)],['自分',r=>parseBets(pk(r.id).mine)]];
  const aggOf=list=>srcs.map(([name,f])=>{let n=0,pts=0,inv=0,ret=0,hits=0;list.forEach(r=>{const bs=f(r),x=resultOf(r),ks=Object.keys(bs);if(!ks.length)return;n++;pts+=ks.length;inv+=sum(Object.values(bs));if(bs[x.order]){hits++;ret+=(x.payout||0)*bs[x.order]/100;}});return {name,n,pts,inv,ret,hits};});
  const agg=aggOf(done);
  // ChatGPT・一撃くん・自分のどれかを入れたレースだけで、同じ条件で比べる
  const same=done.filter(r=>{const q=pk(r.id);return q.chatgpt||q.ikkun||q.mine;});
  const aggS=same.length?aggOf(same):null;
  const tbl=(g)=>`<div class="tablebox"><table class="rec">
      <thead><tr><th>予想</th><th>レース数</th><th>平均点数</th><th>的中</th><th>的中率</th><th>投資</th><th>払戻</th><th>回収率</th></tr></thead>
      <tbody>${g.map(g=>`<tr><td class="src">${g.name}</td><td>${g.n}</td><td>${g.n?(g.pts/g.n).toFixed(1)+'点':'-'}</td><td>${g.hits}</td><td>${g.n?pct(g.hits/g.n):'-'}</td><td>${yen(g.inv)}</td><td>${yen(Math.round(g.ret))}</td><td class="${g.inv&&g.ret>=g.inv?'hit':''}">${g.inv?Math.round(g.ret/g.inv*100)+'%':'-'}</td></tr>`).join('')}</tbody></table></div>`;
  el.innerHTML=`<div style="display:grid;gap:16px">${learnPanel()}
    ${aggS?`<div><p class="card-title">同じレースで比較（他の予想を入れた${same.length}レース）</p>${tbl(aggS)}</div>`:''}
    <div><p class="card-title">${fmtDate(dateSel)}の全レース（入力した金額で計算・${done.length}レース）</p>${tbl(agg)}</div>
    <div><p class="card-title">レースごと</p><div class="tablebox"><table class="rec">
      <thead><tr><th>レース</th><th>結果</th><th>払戻</th><th>AI本線</th><th>AI穴</th><th>ChatGPT</th><th>一撃くん</th><th>自分</th></tr></thead>
      <tbody>${done.sort((a,b)=>a.jcd-b.jcd||a.rno-b.rno).map(r=>{const x=resultOf(r);return `<tr><td class="src">${esc(r.venue||VENUES[r.jcd])}${r.rno}R</td><td>${esc(x.order)}</td><td>${yen(x.payout)}</td>${srcs.map(([,f])=>{const bs=f(r),ks=Object.keys(bs);return `<td>${!ks.length?'-':bs[x.order]?`<span class="hit">的中</span><br><small>${yen(Math.round(x.payout*bs[x.order]/100))}</small>`:'×'}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>
    <p class="hint">AIの本線・穴は、締切時点でこの端末に記録した買い目で数えます（記録前のレースは今のデータで計算）。</p>
  </div>`;
}

/* ============ 起動 ============ */
$('#date').addEventListener('change',e=>{dateSel=e.target.value;raceId=null;loadDay();});
$('#venue').addEventListener('change',e=>{jcdSel=+e.target.value;LS.set('jcd',jcdSel);raceId=null;renderChips();renderView();});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;raceId=b.dataset.id;renderChips();renderView();});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;LS.set('view',view);renderView();}));
// ---------------------------------------------------------------- 合言葉（データの暗号を解く）
// 合言葉 → PBKDF2-SHA256(310000回) → AES-256-GCM。scraper/crypt.py と同じ計算。端末には合言葉ではなく鍵だけを保存
let DKEY=null;
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('teiyomi-v1'),iterations:310000},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openBox(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(box.iv)},key||DKEY,ub64(box.ct));return JSON.parse(new TextDecoder().decode(pt));}
let PLAIN=false; // 切り替え前（鍵のかかったデータがまだ無い）は今まで通り読む
async function fetchEnc(path,key){if(PLAIN&&!key)return fetchJSON(path);return openBox(await fetchJSON('enc/'+path),key);}
async function unlock(){
  try{const r=await fetch(DATA_BASE+'enc/model.json?t='+Date.now(),{cache:'no-store'});if(r.status===404){PLAIN=true;return;}}catch(_){}
  try{const raw=LS.get('k',null);if(raw){const k=await crypto.subtle.importKey('raw',ub64(raw),{name:'AES-GCM'},true,['decrypt']);await fetchEnc('model.json',k);DKEY=k;return;}}catch(_){}
  const L=$('#lock');L.hidden=false;$('#lockpw').focus();
  await new Promise(res=>{$('#lockf').onsubmit=async e=>{e.preventDefault();const msg=$('#lockmsg');msg.textContent='確認中…';
    try{const k=await deriveKey($('#lockpw').value.trim().normalize('NFKC'));await fetchEnc('model.json',k);DKEY=k;
      LS.set('k',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k)))));L.hidden=true;res();}
    catch(_){msg.textContent='合言葉が違うか、通信できませんでした。';}};});
}
(async()=>{
  await unlock();
  let m=null;
  try{m=await fetchEnc('model.json');}catch(_){}
  if(m)MODEL={...MODEL,...m,weights:{...MODEL.weights,...(m.weights||{})},market:{...MODEL.market,...(m.market||{}),cls:{...MODEL.market.cls,...((m.market||{}).cls||{})}},ana:{...MODEL.ana,...(m.ana||{})}};
  try{REPORT=await fetchEnc('report.json');}catch(_){}
  try{STATS=await fetchEnc('stats.json');}catch(_){}
  await loadIndex();await loadDay();
  setInterval(async()=>{if(document.hidden||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;const keep=raceId;await loadDay();raceId=keep;renderChips();},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDay();});
})();
</script>
